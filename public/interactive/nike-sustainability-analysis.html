:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;padding:0}

<body>
<style>
:root{
  --paper:#ffffff; --plane:#f6f6f4; --panel:#ffffff;
  --ink:#0a0a0a; --ink2:#55544f; --ink3:#8a8984;
  --hair:#e4e3de; --hair2:#cfcec8; --baseline:#bdbcb5;
  --accent:#eb6834; --accent-ink:#b8461c; --accent-wash:#fdf0ea;
  --ref:#2a78d6; --ref-wash:#e9f1fc; --third:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95; --seq7:#0d366b;
  --neg:#2a78d6; --pos:#d03b3b; --mid:#f0efec;
  --shadow:0 1px 2px rgba(10,10,10,.05), 0 8px 24px -16px rgba(10,10,10,.18);
  --rail:232px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0b0b; --plane:#0b0b0b; --panel:#141413;
  --ink:#ffffff; --ink2:#bfbeb6; --ink3:#8a8984;
  --hair:#26261f; --hair2:#34342c; --baseline:#3c3c34;
  --accent:#d95926; --accent-ink:#f0895c; --accent-wash:#2a1610;
  --ref:#3987e5; --ref-wash:#0f1d30; --third:#199e70;
  --seq1:#0d366b; --seq2:#184f95; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4; --seq7:#cde2fb;
  --neg:#3987e5; --pos:#e66767; --mid:#2c2c28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0b0b0b; --plane:#0b0b0b; --panel:#141413;
  --ink:#ffffff; --ink2:#bfbeb6; --ink3:#8a8984;
  --hair:#26261f; --hair2:#34342c; --baseline:#3c3c34;
  --accent:#d95926; --accent-ink:#f0895c; --accent-wash:#2a1610;
  --ref:#3987e5; --ref-wash:#0f1d30; --third:#199e70;
  --seq1:#0d366b; --seq2:#184f95; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4; --seq7:#cde2fb;
  --neg:#3987e5; --pos:#e66767; --mid:#2c2c28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;
  border-right:1px solid var(--hair);background:var(--paper);padding:20px 0 24px;overflow-y:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.brand .mark{font-family:var(--display);font-weight:900;font-stretch:78%;font-size:26px;line-height:.95;
  letter-spacing:-.035em;text-transform:uppercase}
.brand .mark em{font-style:normal;color:var(--accent)}
.brand .sub{font-size:11px;color:var(--ink3);margin-top:8px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.navlist{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.navbtn{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:baseline;text-align:left;
  background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--ink2);width:100%}
.navbtn .n{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.navbtn .t{font-family:var(--display);font-weight:650;font-stretch:88%;font-size:13.5px;letter-spacing:-.01em;line-height:1.25}
.navbtn:hover{background:var(--plane);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--ink);color:var(--paper)}
.navbtn[aria-current="true"] .n{color:var(--accent)}
.railfoot{padding:16px 20px 0;margin-top:16px;border-top:1px solid var(--hair);font-size:11px;color:var(--ink3);line-height:1.55}

.main{min-width:0;padding-block:0 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--plane) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);padding:12px 28px;display:flex;flex-wrap:wrap;
  gap:10px 18px;align-items:center}
.topbar .where{font-family:var(--display);font-weight:700;font-stretch:85%;font-size:15px;margin-right:auto;letter-spacing:-.015em}
.ctl{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2)}
.ctl label{text-transform:uppercase;letter-spacing:.055em;font-weight:600;font-size:10px;color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--hair2);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{background:none;border:0;padding:5px 11px;font-size:11.5px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.seg button:not(:last-child){border-right:1px solid var(--hair2)}

/* ---------- panels ---------- */
.view{padding:24px 28px 0;display:flex;flex-direction:column;gap:22px;max-width:1420px}
.viewhead{border-bottom:2px solid var(--ink);padding-bottom:14px}
.viewhead .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.viewhead h2{font-size:clamp(28px,4.2vw,46px);font-weight:900;font-stretch:78%;text-transform:uppercase;line-height:.94;margin-top:6px}
.viewhead p{color:var(--ink2);max-width:66ch;margin:10px 0 0;font-size:14.5px}
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none;background:none;border:0;padding:0}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;margin-bottom:14px}
.phead h3{font-size:17px;font-weight:700;font-stretch:92%;line-height:1.2;flex:1 1 320px;min-width:0}
.phead .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:5px;font-weight:500}
.ptools{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair2);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:10.5px;
  cursor:pointer;color:var(--ink2);white-space:nowrap;font-family:var(--mono);letter-spacing:.03em}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grade{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;font-weight:600;border:1px solid}
.grade.descriptive{color:var(--ink2);border-color:var(--hair2);background:var(--plane)}
.grade.diagnostic{color:var(--ref);border-color:var(--ref);background:var(--ref-wash)}
.grade.scenario{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-wash)}

.plot{width:100%;overflow-x:auto}
.plot svg{display:block;max-width:100%;height:auto}
svg text{font-family:var(--body)}
.axislab{font-size:10.5px;fill:var(--ink3)}
.axislab.tn{font-family:var(--mono);font-size:10px}
.serieslab{font-size:11px;fill:var(--ink2);font-weight:600}
.vlab{font-family:var(--mono);font-size:10px;fill:var(--ink2)}
.grid{stroke:var(--hair);stroke-width:1}
.base{stroke:var(--baseline);stroke-width:1}

.story{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);
  border:1px solid var(--hair);border-radius:9px;overflow:hidden;margin-top:16px}
.story>div{background:var(--panel);padding:11px 13px}
.story dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.story dd{margin:0;font-size:12.4px;line-height:1.5;color:var(--ink2)}
.story>div:last-child dt{color:var(--accent-ink)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;padding:0;list-style:none;font-size:11.5px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.08)}
.swatch.line{height:3px;border-radius:2px;width:15px}

table.dt{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border-bottom:1px solid var(--hair);padding:6px 9px;text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;white-space:normal;min-width:150px}
table.dt thead th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;
  border-bottom:1px solid var(--hair2);position:sticky;top:0;background:var(--panel)}
table.dt tbody tr:hover{background:var(--plane)}
.tblwrap{overflow:auto;max-height:440px;border:1px solid var(--hair);border-radius:8px}

.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.kpi{border:1px solid var(--hair);border-radius:10px;padding:13px 14px 12px;background:var(--panel);display:flex;flex-direction:column;gap:9px}
.kpi .kname{font-size:12.2px;font-weight:600;line-height:1.3;color:var(--ink)}
.kpi .kstat{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .kval{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:31px;line-height:1;letter-spacing:-.025em}
.kpi .kunit{font-size:11px;color:var(--ink3)}
.kpi .krow{display:flex;justify-content:space-between;gap:10px;font-size:10.8px;color:var(--ink3);font-family:var(--mono)}
.kpi .krow b{color:var(--ink2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-family:var(--mono);letter-spacing:.07em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;font-weight:600}
.pill.met{background:var(--ink);color:var(--paper)}
.pill.miss{background:var(--plane);color:var(--ink2);border:1px solid var(--hair2)}
.pill.up{color:var(--pos)}.pill.down{color:var(--neg)}

.note{font-size:12px;color:var(--ink3);line-height:1.55;margin:10px 0 0}
.note b{color:var(--ink2);font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}

.insight{border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:10px;padding:16px 18px;background:var(--panel)}
.insight h4{font-size:16px;font-weight:700;font-stretch:92%;line-height:1.25;margin-bottom:8px}
.insight .num{font-family:var(--mono);font-size:10px;color:var(--accent-ink);letter-spacing:.1em;font-weight:600}
.insight p{margin:0 0 9px;font-size:13.2px;color:var(--ink2);line-height:1.58}
.insight .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--hair)}
.insight .meta div{font-size:11.6px;color:var(--ink2);line-height:1.5}
.insight .meta strong{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:3px;font-weight:600}
.calc{font-family:var(--mono);font-size:11px;background:var(--plane);border:1px solid var(--hair);border-radius:7px;
  padding:9px 11px;color:var(--ink2);line-height:1.6;overflow-x:auto}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,92vw);background:var(--panel);z-index:61;
  border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px 14px;border-bottom:1px solid var(--hair);display:flex;gap:12px;align-items:flex-start}
.drawer header h4{font-size:15px;font-weight:700;flex:1}
.drawer .body{padding:16px 20px 30px;overflow-y:auto}
.drawer dl{margin:0;display:flex;flex-direction:column;gap:13px}
.drawer dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.drawer dd{margin:3px 0 0;font-size:12.6px;color:var(--ink2);line-height:1.55}
.x{border:1px solid var(--hair2);background:none;border-radius:6px;width:28px;height:28px;cursor:pointer;flex:none;
  font-size:15px;line-height:1;color:var(--ink2)}
.x:hover{border-color:var(--ink);color:var(--ink)}

.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:7px;
  padding:8px 11px;font-size:11.5px;line-height:1.45;max-width:270px;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.tip.on{opacity:1}
.tip b{font-family:var(--mono);font-weight:600}
.tip .tv{font-family:var(--mono);font-size:12.5px;font-weight:600;display:block;margin-top:2px}


/* ---------- brief view ---------- */
.quote{margin:0;font-family:var(--display);font-weight:650;font-stretch:92%;font-size:clamp(19px,2.3vw,25px);
  line-height:1.26;letter-spacing:-.015em;border-left:3px solid var(--accent);padding:2px 0 2px 16px;color:var(--ink)}
.quote.dim{border-left-color:var(--hair2);color:var(--ink3);font-weight:500}
.rqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px;margin-top:14px}
.rqcard{border:1px solid var(--hair);border-radius:10px;padding:13px 14px 11px;background:var(--panel);
  display:flex;flex-direction:column}
.rqtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.rqn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent-ink);letter-spacing:.08em}
.rqcard h4{font-size:13.6px;font-weight:650;font-stretch:96%;line-height:1.3}
.rqfoot{margin-top:auto;padding-top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3)}
ul.bullets{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
ul.bullets li{font-size:12.6px;line-height:1.55;color:var(--ink2)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:14px}
ol.steps li{counter-increment:st;border-top:2px solid var(--ink);padding-top:9px}
ol.steps li strong{font-family:var(--display);font-weight:700;font-stretch:90%;font-size:14.5px;display:block}
ol.steps li strong::before{content:counter(st,decimal-leading-zero);font-family:var(--mono);font-size:10px;
  font-weight:600;color:var(--accent-ink);letter-spacing:.08em;display:block;margin-bottom:3px}
table.dt.prose td,table.dt.prose th{text-align:left;white-space:normal}
table.dt.prose td:first-child{font-family:var(--mono);font-size:11px;white-space:nowrap;
  vertical-align:top;color:var(--ink);min-width:120px}
table.dt.prose td:last-child{font-size:12.4px;color:var(--ink2);line-height:1.5}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hair);padding:16px 0 10px}
  .brand{padding:0 16px 14px}
  .navlist{flex-direction:row;overflow-x:auto;padding:0 16px 4px;gap:6px}
  .navbtn{grid-template-columns:1fr;gap:2px;min-width:132px;border:1px solid var(--hair);padding:8px 10px}
  .railfoot{display:none}
  .topbar{padding:10px 16px}
  .view{padding:18px 16px 0}
  .story{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .story{grid-template-columns:1fr}
  .panel{padding:15px 14px 14px;border-radius:10px}
  .viewhead h2{font-size:30px}
}
</style>

<div class="shell">
  <nav class="rail" aria-label="Views">
    <div class="brand">
      <div class="mark">From Targets<br>to <em>Leverage</em></div>
      <div class="sub">NIKE, Inc. FY20&ndash;FY25</div>
    </div>
    <div class="navlist" id="nav"></div>
    <div class="railfoot">
      Built from the FY24 and FY25 NIKE, Inc. Sustainability Data reports.
      Independent analysis. Not affiliated with or endorsed by NIKE, Inc.
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="where" id="where">Sustainability Control Tower</div>
      <div class="ctl">
        <label for="basis-latest">Basis</label>
        <div class="seg" role="group" aria-label="Reporting basis">
          <button id="basis-latest" data-basis="latest" aria-pressed="true">Latest restated</button>
          <button id="basis-original" data-basis="original" aria-pressed="false">As originally reported</button>
        </div>
      </div>
      <div class="ctl">
        <div class="seg" role="group" aria-label="Theme">
          <button id="themebtn" aria-pressed="false">Dark</button>
        </div>
      </div>
    </div>
    <main class="view" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>

tion concentrated in one basin delivers little to the other basins the cotton supply chain draws on."}],"reading_note":"HHI is reported on the 0-10,000 convention. Its reciprocal, the effective number of sources, is the more useful figure here: it is the number of equally sized contributors that would produce the same concentration.","caveat":"Concentration statistics describe the composition of a disclosure, not the difficulty or the cost of changing it."},"rq10":{"kind":"scenario","question":"What would the FY30 science-based targets require from here?","label":"Scenario, not forecast.","scope12":{"fy15":264394,"fy25":52430,"fy30_target":92538,"reported_vs_fy15_pct":-80,"target_pct":-65,"status":"Already below the FY30 level. The FY25 owned-or-operated footprint of 52,430 tCO2e sits 43% under the 92,538 tCO2e implied FY30 ceiling.","headroom":40108},"scope3":{"fy15":9219283,"fy25":7378805,"fy30_target":6453498,"reported_vs_fy15_pct":-20,"target_pct":-30,"remaining_gap":925307,"remaining_gap_pct":12.54,"progress_to_date_pct":66.5},"scenarios":[{"id":"linear","name":"Linear pathway","path":[7378805,7193744,7008682,6823621,6638559,6453498],"required_annual_absolute":185061,"required_annual_pct":null,"assumption":"Equal absolute reductions each year from the FY25 level to the FY30 target.","which_sources":"Unspecified; the pathway is arithmetic, not operational."},{"id":"constant_pct","name":"Constant percentage reduction","path":[7378805,7183695,6993743,6808815,6628776,6453498],"required_annual_pct":-2.64,"required_annual_absolute":null,"assumption":"The same percentage cut each year, which front-loads absolute tonnes.","which_sources":"Unspecified."},{"id":"recent_trend","name":"Recent-trend continuation (FY20-FY25 rate)","path":[7378805,6727414,6133526,5592066,5098406,4648325],"required_annual_pct":-8.83,"required_annual_absolute":null,"assumption":"The FY20-FY25 compound rate of -8.9% a year continues unchanged to FY30. This is the least plausible of the set: that rate was produced partly by falling production volume and by reporting changes, neither of which is a repeatable abatement mechanism.","which_sources":"All sources in their FY20-FY25 proportions."},{"id":"recent_trend_3y","name":"Recent-trend continuation (FY22-FY25 rate)","path":[7378805,6674167,6036819,5460334,4938901,4467262],"required_annual_pct":-9.55,"required_annual_absolute":null,"assumption":"The shorter FY22-FY25 compound rate continues to FY30.","which_sources":"All sources in their FY22-FY25 proportions."},{"id":"supplier_manufacturing","name":"Accelerated supplier-energy scenario","lever_fy25":1043528,"lever_share_of_footprint":14.1,"required_reduction_in_lever":925307,"required_reduction_in_lever_pct":88.7,"implied_annual_rate_pct":-35.31,"feasible_within_lever":true,"path":[7378805,7193744,7008682,6823621,6638559,6453498],"assumption":"Tier 1 finished-goods manufacturing carries the entire remaining gap while every other source holds at its FY25 level. Supplier renewable electricity reached 38% of supplier electricity in FY25, up from 0.4% in FY20, so this lever has demonstrated headroom.","which_sources":"supplier_manufacturing"},{"id":"materials_upstream","name":"Materials-led scenario","lever_fy25":4513213,"lever_share_of_footprint":61.2,"required_reduction_in_lever":925307,"required_reduction_in_lever_pct":20.5,"implied_annual_rate_pct":-4.49,"feasible_within_lever":true,"path":[7378805,7193744,7008682,6823621,6638559,6453498],"assumption":"Tier 2 to Tier 4 materials carry the entire remaining gap while everything else holds. This is the largest block in the footprint and the one furthest from NIKE's direct control.","which_sources":"materials_upstream"},{"id":"logistics","name":"Logistics-led scenario","lever_fy25":582688,"lever_share_of_footprint":7.9,"required_reduction_in_lever":925307,"required_reduction_in_lever_pct":158.8,"implied_annual_rate_pct":null,"feasible_within_lever":false,"path":[7378805,7193744,7008682,6823621,6638559,6453498],"assumption":"Upstream and downstream transportation carry the entire remaining gap while everything else holds. Logistics has already fallen 60% since FY20, so the remaining base is small.","which_sources":"logistics"},{"id":"balanced","name":"Balanced intervention scenario","path":[7378805,7193744,7008682,6823621,6638559,6453498],"required_annual_pct":-2.64,"allocation":{"supplier_manufacturing":{"fy25":1043528,"share":14.1,"required_cut":130859,"required_cut_pct":12.5},"materials_upstream":{"fy25":4513213,"share":61.2,"required_cut":565960,"required_cut_pct":12.5},"logistics":{"fy25":582688,"share":7.9,"required_cut":73069,"required_cut_pct":12.5},"end_of_life":{"fy25":484946,"share":6.6,"required_cut":60813,"required_cut_pct":12.5}},"assumption":"Every block cuts by the same percentage, so each carries a share of the gap equal to its share of the footprint. Equivalent to the constant-percentage pathway applied block by block.","which_sources":"All blocks proportionally."}],"years":["FY25","FY26","FY27","FY28","FY29","FY30"],"carbon_budget":{"cumulative_under_linear":34118104,"cumulative_under_constant_pct":34068527,"note":"Cumulative FY26-FY30 Scope 3 tonnes under each pathway. The constant-percentage path front-loads reductions and therefore emits less cumulatively than the linear path, even though both land on the same FY30 level."},"baseline_warning":"NIKE states in the FY25 report that it is restating its Science-Based Target with an adjusted baseline, and has not revised FY15-FY19 for the radiative-forcing and well-to-wheel changes applied to FY20-FY25. Every percentage in this section is therefore measured against an FY15 baseline on the old basis while the FY25 value is on the new one. The direction of the bias is known: the restatement raised FY20-FY24 Scope 3 by 0.04% to 0.9%, so the true like-for-like reduction against a restated FY15 would be slightly smaller than the reported 20%.","caveat":"No forecast is made. Each pathway is an arithmetic consequence of stated assumptions, and none of them is a prediction of what NIKE will do or of what is technically or commercially achievable."}},"insights":[{"id":"I1","rank":1,"rq":"RQ2","title":"The lever that delivered the last five years is now 0.7% of the footprint","finding":"Owned-and-operated emissions fell 77% between FY20 and FY25, from 227,670 to 52,430 tCO2e, and market-based Scope 2 is now 58 tCO2e. That entire block is 0.7% of the 7.43M tCO2e corporate footprint. The renewable-electricity programme that produced it is complete at 100%, so it cannot be run again.","calculation":"Owned-or-operated = Scope 1 + Scope 2 market-based. FY25: 52,372 + 58 = 52,430. Share of total: 52,430 / 7,431,235 = 0.71%. Renewable electricity: 48% in FY20 to 100% in FY25.","visualization":"Carbon Systems Map - scope composition and the renewable transition panel","strategic_relevance":"Any FY26-FY30 carbon plan built on the FY20-FY25 playbook is planning against an exhausted lever. The marginal ton now has to come from supplier energy, materials, or product design, all of which run through commercial relationships rather than a procurement contract NIKE signs alone.","caveat":"Market-based Scope 2 of zero reflects certificate and PPA procurement. Location-based Scope 2 is still 195,800 tCO2e, so the physical grid draw has not disappeared.","data_needed":"Marginal abatement cost by lever, and the contract tenor and renewal risk on the 262,492 MWh of virtual PPAs and 124,182 MWh of unbundled certificates.","source":"FY25 pp.5, 19, 20, 23"},{"id":"I2","rank":2,"rq":"RQ1","title":"Three fifths of the footprint sits in materials, and it improved slower than everything else","finding":"Tier 2 to Tier 4 materials are 4.51M tCO2e, 60.7% of the FY25 footprint. That block fell 37.2% since FY20, almost exactly the 37.8% whole-footprint fall, so five years of work left the composition of the problem unchanged. Within it, Tier 3 footwear rose 40% and is the only large line moving the wrong way.","calculation":"Materials block FY25 = Tier 2 Footwear + Tier 2 Apparel + Tier 2-4 Accessories + Tier 3 Footwear + Tier 3 Apparel + Tier 4 Footwear + Tier 4 Apparel = 4,513,213. Share = 60.7%. FY20 = 7,185,532, change = -37.2% against a whole-footprint -37.8%. Tier 3 Footwear 458,388 to 642,496 = +40.2%.","visualization":"Carbon Systems Map - FY20 to FY25 waterfall and the Scope 3 hotspot Pareto","strategic_relevance":"Decarbonisation effort has been proportional rather than targeted. Holding composition constant while the total falls is what you would expect from a volume decline plus across-the-board efficiency, not from a materials strategy.","caveat":"Tier 3 and Tier 4 emissions are modelled from lifecycle factors, not measured. NIKE discloses that only 24% of purchased goods and services emissions use supplier data, and the Higg MSI v3.8 factor update in FY24 moves these lines independently of any physical change.","data_needed":"Product-level bills of materials joined to volume, so the materials block can be split into volume, mix and intensity rather than read as one number.","source":"FY25 pp.24, 25"},{"id":"I3","rank":3,"rq":"RQ3","title":"Preferred-material share rose and credited abatement fell in the same year","finding":"EPM share went from 48% to 51% in FY25, clearing its 50% target, while materials GHG abatement fell 142,000 tCO2e, from 1,033,811 to 892,068. The two metrics that share a single target statement moved in opposite directions. The most likely arithmetic reason is volume: tabulated material tonnage across the five named materials fell 9.7% in FY25, and abatement is a share multiplied by a volume.","calculation":"EPM 48% to 51% (+3 p.p.); abatement 1,033,811 to 892,068 (-13.7%). Total tabulated volume across polyester, cotton, rubber, EVA foam and leather: 528,683 t in FY24 to 477,584 t in FY25, -9.7%. Rubber -24.2%, EVA foam -9.7%, leather -11.7%, cotton -3.9%, polyester -4.1%.","visualization":"Materials + Circularity Lab - EPM share against abatement, with the volume overlay","strategic_relevance":"A percentage-share target rewards the ratio and is silent on the quantity. If the FY26-FY30 materials target keeps that shape, NIKE can report improving substitution during a demand contraction while the tonnes avoided fall. The target design, not the performance, is the thing to revisit.","caveat":"This is a hypothesis consistent with the arithmetic, not a demonstrated mechanism. NIKE does not publish material-specific avoided-emission factors or the conventional-material counterfactual, so the decomposition cannot be closed with public data.","data_needed":"Avoided-emission factors by material and the counterfactual baseline, plus volumes by product engine.","source":"FY25 pp.5, 11"},{"id":"I4","rank":4,"rq":"RQ5","title":"98% diverted, but a quarter of what is diverted is burned","finding":"The diversion rate reads 98%, two points off a 100% target. Rebuilding the funnel from the five tabulated waste streams shows 50,195 of the 197,641 diverted tonnes are waste-to-energy, 25.4% of diversion and no material recovery at all. The material-recovery rate is 73.1%, not 98%. Separately, the only disclosed post-consumer stream fell 24% in FY25, from 2,040 to 1,559 tonnes.","calculation":"From FY25 p.29, summed across DCs, HQs, FW manufacturing, AP manufacturing and Air MI: generated 201,768 t; recycled 145,596; composted 1,850; waste-to-energy 50,195; landfilled 4,127. Diversion = 197,641 / 201,768 = 98.0%. Recycling and composting = 147,446 / 201,768 = 73.1%. Waste-to-energy share of diverted = 25.4%.","visualization":"Materials + Circularity Lab - the circularity funnel, with the stage the disclosure cannot reach marked","strategic_relevance":"Diversion and circularity are different objectives measured by one number. Under an EU regime that treats incineration as disposal, a quarter of the reported diversion does not count. The funnel also stops one stage short of the question that matters: the p.30 disposition category reads 'Recycled into NIKE Products and Other Industry Products' as a single line, so closed-loop recycling cannot be separated from open-loop.","caveat":"The five tabulated streams are not the same population as the target scope on p.6, which covers packaging in finished-goods manufacturing, ~95% of footwear production and ~60% of apparel production. The 98% computed here agrees with the printed 98% by coincidence of magnitude, not by construction.","data_needed":"Tonnes of recycled material physically reintroduced into NIKE product, split from tonnes sold into other industries.","source":"FY25 pp.6, 29, 30"},{"id":"I5","rank":5,"rq":"RQ6","title":"Water intensity is improving faster than water use, because the activity base grew","finding":"Freshwater intensity fell 19.0% since FY20, from 84 to 68 L/kg. Absolute freshwater use fell only 13.4%, from 20,609 to 17,853 million litres. Dividing one by the other gives an implied dyed-and-finished mass that rose about 7% over the same period. Efficiency gains were partly spent on more throughput.","calculation":"Implied mass = absolute use / intensity. FY20: 20,609,000,000 L / 84 L/kg = 245.3M kg. FY25: 17,853,000,000 / 68 = 262.5M kg. Change +7.0%.","visualization":"Water + Chemistry - intensity against absolute use, indexed to FY20, with the implied activity line","strategic_relevance":"In a water-stressed basin, the withdrawal is what matters, not the ratio. A target expressed only in L/kg can be met while the basin draw stays flat. The next target set needs an absolute complement.","caveat":"Intensity and absolute use are printed for overlapping but separately defined supplier populations, so the implied mass is an indicative quantity, not a disclosed one. Both series are rounded in the source.","data_needed":"Withdrawal by facility joined to basin water stress, and the mass actually dyed and finished.","source":"FY25 pp.6, 30"},{"id":"I6","rank":6,"rq":"RQ7","title":"Chemical management halved at Tier 1 while occupational health and hygiene rose to the top","finding":"In the Tier 1 finding composition, chemical management fell from 14.8% to 6.4%, the largest single move in the matrix, while occupational health and hygiene rose from 14.4% to 18.0% and working hours from 5.3% to 12.7%. At distribution centres, working hours alone is 46.2% of findings. Meanwhile DC Foundational Expectations compliance fell from 60% to 50%, the only value-chain area to move backwards.","calculation":"FY24 to FY25 Tier 1 composition: chemical management -8.4 p.p., occupational health and hygiene +3.6 p.p., working hours +7.4 p.p., freedom of association +3.8 p.p. DC compliance 60% to 50% (FY25 p.7).","visualization":"Supply Chain People + Compliance - the finding heatmap and the value-chain compliance slope","strategic_relevance":"The chemistry programme shows up in the audit data, which is the clearest evidence in these reports that a targeted supplier programme changes findings. The same machinery has not been pointed at working hours, and distribution centres are moving the wrong way while the narrative is about supplier factories.","caveat":"These are compositions within a tier, not prevalence. Each column sums to 100, so a category can rise because another fell. A finding is not evidence of unlawful conduct; NIKE states it may be an indicator, a documentation gap or a management system deficiency.","data_needed":"Finding counts and facility counts by category, rather than shares, and remediation closure times.","source":"FY25 pp.7, 8; FY24 pp.7, 8"},{"id":"I7","rank":7,"rq":"RQ10","title":"The Scope 3 target needs 12.5% more, and only two levers are individually big enough","finding":"Scope 3 is 7.38M tCO2e against an FY30 target of 6.45M implied by -30% from the FY15 baseline. The remaining gap is 925,307 tCO2e, 12.5% of the current level. If Tier 1 finished-goods manufacturing carried the gap alone it would have to fall 88.7%. Materials would have to fall 20.5%. Logistics cannot carry it at all: the gap is 158.8% of the entire logistics footprint.","calculation":"FY15 Scope 3 = 9,219,283; FY30 target = 9,219,283 x 0.70 = 6,453,498. FY25 = 7,378,805. Gap = 925,307. Lever bases FY25: Tier 1 manufacturing 1,043,528; materials 4,513,213; logistics 582,688.","visualization":"Carbon Systems Map - the 2030 scenario runway, and the lever-feasibility panel","strategic_relevance":"This frames the FY26 planning question precisely: either materials carries a fifth of its own footprint away, or two or three levers move together. It also shows which conversations do not need to happen - no logistics programme closes this gap.","caveat":"Scenario, not forecast. NIKE states it is restating its Science-Based Target with an adjusted baseline and has not revised FY15-FY19 for the radiative-forcing and well-to-wheel changes applied to FY20-FY25, so the -20% progress figure compares a new-basis FY25 with an old-basis FY15.","data_needed":"The restated SBT baseline and target, and supplier-level abatement curves.","source":"FY25 pp.12, 23, 24"},{"id":"I8","rank":8,"rq":"RQ2 / data trust","title":"The manufacturing target headline stopped reconciling with its own components in FY24","finding":"The manufacturing-and-transportation target series on p.5 equals the sum of the six component lines on p.22 exactly for FY20, FY21, FY22 and FY23, to within 1 tCO2e. For FY24 the headline is 67,650 tonnes above the component sum, and for FY25 it is 57,557 tonnes below it. Something changed in FY24 about how the headline is built, and the reports do not say what.","calculation":"p.22 component sums: FY20 3,650,162 (headline 3,650,162); FY21 2,864,812 (2,864,812); FY22 3,085,964 (3,085,965); FY23 2,965,308 (2,965,307); FY24 2,341,978 (2,409,628); FY25 1,994,566 (1,937,009).","visualization":"Data Trust + Methodology - the reconciliation panel","strategic_relevance":"The target is reported achieved at -47%. On the component sum it is -45.4%, so the verdict does not change. What changes is whether the published decomposition can be used to explain the headline, and for FY24 and FY25 it cannot. Anyone building a supplier-level plan off the p.22 lines is working from a base that no longer adds to the number being reported against.","caveat":"This is an observation about two printed tables, not an assertion that either is wrong. Rounding cannot explain a 2.8% residual in a table printed to the unit.","data_needed":"The reconciliation between the target scope and the disclosed component lines for FY24 and FY25.","source":"FY25 p.5 vs p.22"}],"annotations":{"kpi_matrix":{"what":"Eleven of NIKE's seventeen FY25 quantitative targets are reported achieved and six are not.","why":"The split is not random: every carbon target was met and every waste, water and chemistry target was missed. The targets that depended on NIKE's own procurement closed; the ones that depended on supplier or consumer behaviour did not.","next":"Which of the six misses were missed on trajectory and which on definition? Gender equity landed at 99% of a 100% target.","caveat":"Achieved and not achieved are NIKE's own printed verdicts, reproduced here, not a recomputation."},"carbon_waterfall":{"what":"The footprint fell 4.51M tCO2e between FY20 and FY25, from 11.94M to 7.43M, with gross decreases of 4.74M partly offset by 184k of increases.","why":"Four lines carry more than 70% of the fall, and the largest of them is Tier 4 footwear, a raw-materials line NIKE models rather than measures.","next":"How much of the Tier 3 and Tier 4 movement is production volume, how much is the Higg MSI v3.8 factor update, and how much is physical change at suppliers?","caveat":"Contribution to an observed change is arithmetic, not attribution. Nothing here identifies a cause."},"leverage_matrix":{"what":"Materials sits at 60.7% of the footprint improving at 8.9% a year; owned-and-operated sits at 0.7% improving at 25.3% a year.","why":"Position in this matrix tells you where the next unit of effort has mass behind it. The fast quadrant is nearly empty of large sources now.","next":"What is the marginal abatement cost in each quadrant, and which suppliers sit behind the largest bubbles?","caveat":"Bubble transparency encodes a data-confidence score built here from primary-data share, assurance, series completeness and definition stability. It is a construct of this project, not a NIKE disclosure."},"renewable_transition":{"what":"Owned renewable electricity reached 100% in FY25 while supplier renewable electricity reached 38%, up from 0.4% in FY20.","why":"This is the clearest picture of where the constraint moved. The owned curve has no headroom left; the supplier curve has 62 points of it.","next":"What share of the supplier renewable growth is contracted versus grid-mix drift, and which of the top twenty suppliers by emissions are still under 20%?","caveat":"Supplier figures cover footwear and apparel focus suppliers only, a different population from the Tier 1 and Tier 2 emissions lines."},"scope3_pareto":{"what":"Twenty-two disclosed Scope 3 sources, with the top three at 40% of the total and an effective number of sources of 10.2.","why":"This is a broad footprint, not a concentrated one. There is no single intervention that moves the total; a 2030 plan needs a portfolio.","next":"Which sources share an underlying driver, so that one supplier programme moves several lines at once?","caveat":"Source definitions are NIKE's own tier vocabulary, and the tiers are not mutually exclusive with the GHG Protocol categories reported on pp.25-28."},"target_trajectories":{"what":"Classified by explicit rules, three targets were exceeded, five met, one a near miss and six left a partial gap; two show a final-year rebound.","why":"Shape matters for the next target cycle. A target met after a rebound year is a different planning input from one met on a sustained curve.","next":"For the two rebound cases, is the final-year reversal a demand effect or a programme effect?","caveat":"Classification rules are stated in the methodology and applied uniformly. All seventeen classifications agree with NIKE's own printed verdict, which is a check on the rules rather than a finding."},"material_vs_abatement":{"what":"EPM share rose 3 p.p. to 51% in FY25 while credited materials abatement fell 142k tCO2e.","why":"The share target and the tonnage target point in different directions when volume moves. That is a target-design question, not a performance question.","next":"What are the avoided-emission factors by material, and what counterfactual baseline are they measured against?","caveat":"The divergence is consistent with a volume effect but the reports do not disclose enough to test it. Labelled a hypothesis throughout."},"circularity_funnel":{"what":"Of 201,768 tonnes generated, 197,641 are diverted, 147,446 are recycled or composted, and the funnel cannot be traced past that point.","why":"Waste-to-energy is 25.4% of diversion. The gap between the diversion headline and material recovery is the difference between less waste and more circularity.","next":"How many tonnes of recycled material physically re-enter NIKE product, and at what yield?","caveat":"The five tabulated streams are not the same population as the target scope, so this funnel is an independent construction and not a rebuild of the printed 98%."},"water_dual":{"what":"Intensity fell 19.0% and absolute use 13.4%; the implied activity base rose about 7%.","why":"Efficiency is real but partly absorbed by throughput. Restoration, at 9.2B litres cumulative, is 96.7% in one country.","next":"Which basins do the 17.9 billion litres come from, and how do they map to the restoration portfolio?","caveat":"Intensity, absolute use and restoration cover three different supplier and geographic populations and cannot be netted."},"compliance_heatmap":{"what":"Chemical management fell 8.4 p.p. in the Tier 1 finding composition while working hours rose 7.4 p.p. and occupational health and hygiene rose 3.6 p.p.","why":"It is the clearest sign in these reports that a targeted supplier programme shifts findings, and the clearest sign that hours have not had the same attention.","next":"Are working-hours findings concentrated in particular countries or particular peak production months?","caveat":"These are compositions within a tier, not prevalence rates, and a finding is not evidence of unlawful conduct."},"exposure_proxy":{"what":"Weighting each tier's finding composition by that tier's workforce puts occupational health and hygiene, working hours and wages and benefits at the top.","why":"Working hours dominates the distribution-centre column at 46.2%, but distribution centres hold 1.9% of the workforce. Scale changes which column deserves attention first.","next":"Which countries within Tier 1 South and South East Asia drive the hours finding, and what is the audit coverage rate there?","caveat":"Not workers affected. Not incidence. Not a claim that any worker experienced the issue. A prioritisation device only, and it assumes the audited subset represents the tier."},"scenario_runway":{"what":"A 925,307 tCO2e gap to the FY30 Scope 3 target, and seven transparent pathways to it.","why":"Naming which lever could carry the gap alone, and which cannot, turns a target into a planning constraint.","next":"What is the abatement supply curve at each supplier tier, and what does a 20% materials reduction cost?","caveat":"Scenario, not forecast. The FY15 baseline is on the pre-restatement basis while FY25 is on the new one, and NIKE has said the SBT baseline is itself being restated."},"lineage":{"what":"934 historical observations appear in both reports. 871 are identical, 43 are restatements, 18 are rounding, one is a derived restatement and one is undetermined.","why":"Two restatements move the headline: corporate jets and commercial air travel both gained radiative forcing, raising FY20-FY24 Scope 1 and Scope 3. A third, silent, correction fixed a CY22 supplier injury column.","next":"Which of NIKE's own dashboards were built on the FY24 vintage, and were they rebuilt?","caveat":"A restatement is a sign of maturing measurement, not of error. What matters is whether downstream users know it happened."}},"data":{"targets":[{"id":"rsc_hs_level3_pct","name":"% suppliers with Level 3 health and safety maturity","pillar":"Responsible Supply Chain","topic":"Health & Safety","statement":"100% of strategic suppliers are building healthy and safe workplaces","unit":"%","latest":{"FY20":22,"FY21":27,"FY22":47,"FY23":76,"FY24":96,"FY25":100},"original":{"FY20":22,"FY21":27,"FY22":47,"FY23":76,"FY24":96},"baseline_year":"FY20","baseline":22,"required":100,"target_label":"100","target_unit":null,"direction":"increase","status":"Target Achieved","completion":1.0,"attainment":"Target met","shape":"Sustained improvement","normalised":{"FY20":0.0,"FY21":0.0641,"FY22":0.3205,"FY23":0.6923,"FY24":0.9487,"FY25":1.0},"last_step":0.0513,"avg_step":0.2,"accel":0.216,"volatility":0.1237,"monotonicity":1.0,"page":4,"scope":"Strategic suppliers: strategic finished goods suppliers; suppliers representing approximately 80% of total footwear and apparel production.","method":"Supplier must reach Level 3 safety and health maturity on the Culture of Safety Maturity Assessment.","assurance":null,"footnote":"FY25 p.4 notes 3,4","vs_prior":"+4 P.P.","vs_baseline":"+78 P.P."},{"id":"rsc_gender_equity_pct","name":"% suppliers achieving mature gender-equitable capability","pillar":"Responsible Supply Chain","topic":"Gender Equity","statement":"100% of strategic suppliers have gender equitable (GE) workplaces","unit":"%","latest":{"FY20":null,"FY21":0,"FY22":2,"FY23":23,"FY24":67,"FY25":99},"original":{"FY20":null,"FY21":0,"FY22":2,"FY23":23,"FY24":67},"baseline_year":"FY21","baseline":0,"required":100,"target_label":"100","target_unit":null,"direction":"increase","status":"Target Not Achieved","completion":0.99,"attainment":"Near miss","shape <script>
(function(){
"use strict";
const B = JSON.parse(document.getElementById('D').textContent);
const D = B.data, RQ = B.rq, ANN = B.annotations, PROV = B.provenance, INS = B.insights;
const Y6 = B.years, Y11 = B.sbt_years;
const NS = 'http://www.w3.org/2000/svg';

/* ---------------- helpers ---------------- */
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,a,kids)=>{const n=document.createElement(t);ap(n,a,kids);return n;};
const s_ = (t,a,kids)=>{const n=document.createElementNS(NS,t);ap(n,a,kids);return n;};
function ap(n,a,kids){
  if(a) for(const k in a){ const v=a[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='html') n.innerHTML=v;
    else if(k==='text') n.textContent=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else if(k==='cls') n.setAttribute('class',v);
    else n.setAttribute(k,v);
  }
  if(kids) (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c===null||c===undefined||c===false)return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = (v,d)=> (v===null||v===undefined||Number.isNaN(v))?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d===undefined?0:d, minimumFractionDigits:d===undefined?0:d});
function compact(v,dp){
  if(v===null||v===undefined) return '—';
  const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(dp===undefined?2:dp)+'B';
  if(a>=1e6) return (v/1e6).toFixed(dp===undefined?2:dp)+'M';
  if(a>=1e3) return (v/1e3).toFixed(a>=1e5?0:1)+'k';
  return num(v, a<10&&a>0?1:0);
}
const sign = v => (v>0?'+':'')+num(v);
const pctf = (v,d)=> v===null||v===undefined?'—':(v>0?'+':'')+v.toFixed(d===undefined?1:d)+'%';

/* tooltip */
const tip = $('#tip');
let tipOn=false;
function showTip(html,ev){ tip.innerHTML=html; tip.classList.add('on'); tipOn=true; moveTip(ev); }
function moveTip(ev){ if(!tipOn)return; const r=tip.getBoundingClientRect();
  let x=ev.clientX+14, y=ev.clientY+14;
  if(x+r.width>innerWidth-8) x=ev.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=ev.clientY-r.height-14;
  tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'; }
function hideTip(){ tip.classList.remove('on'); tipOn=false; }
addEventListener('scroll',hideTip,{passive:true});
function hov(node, fn){
  node.addEventListener('pointerenter', e=>showTip(fn(),e));
  node.addEventListener('pointermove', moveTip);
  node.addEventListener('pointerleave', hideTip);
  node.style.cursor='default';
  return node;
}

/* ---------------- scales & axes ---------------- */
function nice(max,min){
  min = min===undefined?0:min;
  if(max===min){max=min+1;}
  const span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/4)));
  const cands=[1,2,2.5,5,10].map(m=>m*step);
  const st=cands.find(c=>span/c<=5.5)||cands[cands.length-1];
  return {lo:Math.floor(min/st)*st, hi:Math.ceil(max/st)*st, step:st};
}
function ticks(lo,hi,step){ const t=[]; for(let v=lo; v<=hi+step/1e6; v+=step) t.push(+v.toFixed(10)); return t; }

function frame(w,h,m){
  const g=s_('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,role:'img'});
  g.$iw = w-m.l-m.r; g.$ih = h-m.t-m.b; g.$m=m;
  g.$plot = s_('g',{transform:`translate(${m.l},${m.t})`});
  g.appendChild(g.$plot);
  return g;
}
function yAxis(sv,lo,hi,step,fmt,label){
  const {$iw:iw,$ih:ih}=sv;
  ticks(lo,hi,step).forEach(v=>{
    const y=ih-(v-lo)/(hi-lo)*ih;
    sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:y,y2:y,cls:'grid'}));
    sv.$plot.appendChild(s_('text',{x:-8,y:y+3.5,cls:'axislab tn','text-anchor':'end',text:fmt?fmt(v):compact(v)}));
  });
  if(label) sv.$plot.appendChild(s_('text',{x:-sv.$m.l+2,y:-10,cls:'axislab','text-anchor':'start',text:label}));
}
function xCats(sv,cats,opt){
  opt=opt||{};
  const {$iw:iw,$ih:ih}=sv;
  const n=cats.length, bw=iw/n;
  cats.forEach((c,i)=>{
    sv.$plot.appendChild(s_('text',{x:bw*(i+.5),y:ih+16,cls:'axislab tn','text-anchor':'middle',text:c}));
  });
  sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:ih,y2:ih,cls:'base'}));
  return bw;
}
function wrapText(str,max){
  const w=String(str).split(' '); const out=[]; let cur='';
  w.forEach(x=>{ if((cur+' '+x).trim().length>max){out.push(cur.trim());cur=x;} else cur+=' '+x; });
  if(cur.trim()) out.push(cur.trim());
  return out;
}

/* ---------------- charts ---------------- */
function chLine(o){
  const w=o.w||640,h=(o.h||260)+(o.ylabel?8:0),m=o.m||{t:o.ylabel?26:16,r:o.rpad||14,b:28,l:o.lpad||52};
  const cats=o.cats, allv=[];
  o.series.forEach(s=>cats.forEach(c=>{const v=s.v[c]; if(v!==null&&v!==undefined) allv.push(v);}));
  if(o.extra) o.extra.forEach(v=>allv.push(v));
  const mx=Math.max(...allv), mn=o.zero===false?Math.min(...allv):Math.min(0,...allv);
  const sc=o.ylim?{lo:o.ylim[0],hi:o.ylim[1],step:(o.ylim[1]-o.ylim[0])/(o.yticks||5)}:nice(mx,mn);
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  yAxis(sv,sc.lo,sc.hi,sc.step,o.yfmt,o.ylabel);
  let clipId=null;
  if(o.ylim){
    clipId='clip'+Math.random().toString(36).slice(2,9);
    const d=s_('defs',{},s_('clipPath',{id:clipId},s_('rect',{x:-4,y:-6,width:iw+8,height:ih+12})));
    sv.$plot.appendChild(d);
  }
  const bw=xCats(sv,cats);
  const X=i=> cats.length===1?iw/2:(iw/(cats.length-1))*i;
  const Y=v=> ih-(v-sc.lo)/(sc.hi-sc.lo)*ih;
  const labels=[];
  const layer = clipId ? sv.$plot.appendChild(s_('g',{'clip-path':`url(#${clipId})`})) : sv.$plot;
  o.series.forEach(s=>{
    const pts=[]; cats.forEach((c,i)=>{const v=s.v[c]; if(v!==null&&v!==undefined) pts.push([X(i),Y(v),c,v]);});
    if(!pts.length) return;
    if(s.dash) layer.appendChild(s_('path',{d:'M'+pts.map(p=>p[0]+','+p[1]).join('L'),fill:'none',stroke:s.color,'stroke-width':s.wt||2,'stroke-dasharray':s.dash,'stroke-linejoin':'round','stroke-linecap':'round',opacity:s.op||1}));
    else layer.appendChild(s_('path',{d:'M'+pts.map(p=>p[0]+','+p[1]).join('L'),fill:'none',stroke:s.color,'stroke-width':s.wt||2,'stroke-linejoin':'round','stroke-linecap':'round',opacity:s.op||1}));
    pts.forEach(p=>{
      const c=s_('circle',{cx:p[0],cy:p[1],r:s.wt&&s.wt<2?3:4,fill:s.color,stroke:CSSV('--panel'),'stroke-width':2});
      hov(c,()=>`<b>${s.name}</b> · ${p[2]}<span class="tv">${o.tfmt?o.tfmt(p[3]):num(p[3])}</span>`);
      layer.appendChild(c);
    });
    if(s.label!==false){
      const last=pts[pts.length-1];
      labels.push({x:last[0]+6,y:Math.max(6,Math.min(ih-4,last[1])),color:s.color,text:s.short||s.name});
    }
  });
  if(labels.length){
    labels.sort((a,b)=>a.y-b.y);
    const gap=13;
    for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<gap) labels[i].y=labels[i-1].y+gap;
    const over=labels.length?labels[labels.length-1].y-ih:0;
    if(over>0) labels.forEach(l=>l.y-=Math.min(over, labels[0].y));
    labels.forEach(l=>sv.$plot.appendChild(s_('text',{x:l.x,y:l.y+3.5,cls:'serieslab',fill:l.color,text:l.text})));
  }
  if(o.markers) o.markers.forEach(mk=>{
    const y=Y(mk.v);
    sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:y,y2:y,stroke:mk.color||CSSV('--ink3'),'stroke-width':1.5,'stroke-dasharray':'4 4'}));
    sv.$plot.appendChild(s_('text',{x:2,y:y-5,cls:'axislab',fill:mk.color||CSSV('--ink3'),text:mk.label}));
  });
  return sv;
}

function chBar(o){
  const w=o.w||640,h=(o.h||250)+(o.ylabel?8:0),m=o.m||{t:o.ylabel?26:14,r:12,b:30,l:o.lpad||52};
  const vals=o.cats.map(c=>o.v[c]).filter(v=>v!==null&&v!==undefined);
  const sc=nice(Math.max(...vals,0),Math.min(0,...vals));
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  yAxis(sv,sc.lo,sc.hi,sc.step,o.yfmt,o.ylabel);
  const bw=xCats(sv,o.cats);
  const Y=v=> ih-(v-sc.lo)/(sc.hi-sc.lo)*ih, y0=Y(0);
  o.cats.forEach((c,i)=>{
    const v=o.v[c]; if(v===null||v===undefined) return;
    const y=Y(v), x=bw*i+bw*0.17, bwd=bw*0.66;
    const col = o.color ? (typeof o.color==='function'?o.color(v,c,i):o.color) : CSSV('--ink');
    const r=s_('rect',{x,y:Math.min(y,y0),width:bwd,height:Math.max(1.5,Math.abs(y0-y)),fill:col,rx:3});
    hov(r,()=>`<b>${c}</b><span class="tv">${o.tfmt?o.tfmt(v):num(v)}</span>${o.tnote?'<br>'+o.tnote(v,c):''}`);
    sv.$plot.appendChild(r);
    if(o.labels!==false) sv.$plot.appendChild(s_('text',{x:x+bwd/2,y:(v>=0?Math.min(y,y0)-6:Math.max(y,y0)+13),cls:'vlab','text-anchor':'middle',text:o.lfmt?o.lfmt(v):compact(v)}));
  });
  return sv;
}

function chHBar(o){
  const rows=o.rows, lw=o.lw||190, rh=o.rh||24, w=o.w||660;
  const h=rows.length*rh+34;
  const vals=rows.map(r=>r.v);
  const mx=Math.max(...vals,0), mn=Math.min(0,...vals);
  const sc=nice(mx,mn);
  const m={t:20,r:o.rpad||46,b:14,l:lw};
  const sv=frame(w,h,m), iw=sv.$iw;
  const X=v=> (v-sc.lo)/(sc.hi-sc.lo)*iw, x0=X(0);
  ticks(sc.lo,sc.hi,sc.step).forEach(v=>{
    sv.$plot.appendChild(s_('line',{x1:X(v),x2:X(v),y1:-6,y2:rows.length*rh,cls:'grid'}));
    sv.$plot.appendChild(s_('text',{x:X(v),y:-10,cls:'axislab tn','text-anchor':'middle',text:o.afmt?o.afmt(v):compact(v)}));
  });
  rows.forEach((r,i)=>{
    const y=i*rh+3, bh=rh-8;
    const x=Math.min(X(r.v),x0), bw=Math.max(1.5,Math.abs(X(r.v)-x0));
    const rect=s_('rect',{x,y,width:bw,height:bh,fill:r.color||o.color||CSSV('--ink'),rx:3});
    hov(rect,()=>`<b>${r.label}</b><span class="tv">${o.tfmt?o.tfmt(r.v):num(r.v)}</span>${r.note?'<br>'+r.note:''}`);
    sv.$plot.appendChild(rect);
    sv.$plot.appendChild(s_('text',{x:-8,y:y+bh/2+3.5,cls:'axislab','text-anchor':'end',text:r.label.length>34?r.label.slice(0,33)+'…':r.label}));
    const inside = bw>44;
    const lx = r.v>=0 ? (x+bw+6) : (inside ? x+6 : Math.max(2, x-6));
    const anc = r.v>=0 ? 'start' : (inside ? 'start' : 'end');
    sv.$plot.appendChild(s_('text',{x:lx,y:y+bh/2+3.5,cls:'vlab','text-anchor':anc,
      fill: (r.v<0&&inside)?CSSV('--paper'):CSSV('--ink2'), text:o.lfmt?o.lfmt(r.v):compact(r.v)}));
  });
  sv.$plot.appendChild(s_('line',{x1:x0,x2:x0,y1:-6,y2:rows.length*rh,cls:'base'}));
  return sv;
}

function chStack(o){
  const w=o.w||640,h=(o.h||270)+(o.ylabel?8:0),m={t:o.ylabel?26:14,r:o.rpad||12,b:30,l:o.lpad||54};
  const totals=o.cats.map(c=>o.keys.reduce((a,k)=>a+(o.v[k]&&o.v[k][c]||0),0));
  const sc=nice(Math.max(...totals),0);
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  yAxis(sv,sc.lo,sc.hi,sc.step,o.yfmt,o.ylabel);
  const bw=xCats(sv,o.cats);
  const Y=v=> ih-(v-sc.lo)/(sc.hi-sc.lo)*ih;
  o.cats.forEach((c,i)=>{
    let acc=0;
    o.keys.forEach((k,j)=>{
      const v=(o.v[k]&&o.v[k][c])||0; if(!v) {acc+=v; return;}
      const y1=Y(acc), y2=Y(acc+v);
      const r=s_('rect',{x:bw*i+bw*.17,y:y2,width:bw*.66,height:Math.max(1,y1-y2-2),fill:o.colors[j],rx:2});
      const tot=totals[i];
      hov(r,()=>`<b>${k}</b> · ${c}<span class="tv">${o.tfmt?o.tfmt(v):num(v)}</span>${(v/tot*100).toFixed(1)}% of ${compact(tot)}`);
      sv.$plot.appendChild(r); acc+=v;
    });
    if(o.totals!==false) sv.$plot.appendChild(s_('text',{x:bw*(i+.5),y:Y(totals[i])-7,cls:'vlab','text-anchor':'middle',text:compact(totals[i])}));
  });
  return sv;
}

function chWaterfall(o){
  const steps=o.steps, w=o.w||900, rh=o.rh||22, lw=o.lw||230;
  const h=steps.length*rh+40;
  let run=0; const pts=[];
  steps.forEach(s=>{
    if(s.type==='total'){ pts.push({...s,from:0,to:s.v}); run=s.v; }
    else { pts.push({...s,from:run,to:run+s.v}); run+=s.v; }
  });
  const all=pts.flatMap(p=> p.type==='total' ? [p.to] : [p.from,p.to]).filter(v=>v!==null&&v!==undefined);
  const lo0=Math.min(...all), hi0=Math.max(...all), pad=(hi0-lo0)*0.05||1;
  const sc=nice(hi0+pad, Math.max(0, lo0-pad));
  const m={t:22,r:64,b:12,l:lw};
  const sv=frame(w,h,m), iw=sv.$iw;
  const X=v=>(v-sc.lo)/(sc.hi-sc.lo)*iw;
  ticks(sc.lo,sc.hi,sc.step).forEach(v=>{
    sv.$plot.appendChild(s_('line',{x1:X(v),x2:X(v),y1:-8,y2:pts.length*rh,cls:'grid'}));
    sv.$plot.appendChild(s_('text',{x:X(v),y:-12,cls:'axislab tn','text-anchor':'middle',text:compact(v)}));
  });
  pts.forEach((p,i)=>{
    const y=i*rh+3, bh=rh-8;
    const cl=v=>Math.max(0,Math.min(iw,X(v)));
    const x1=cl(Math.min(p.from,p.to)), x2=cl(Math.max(p.from,p.to));
    const col = p.type==='total'?CSSV('--ink') : (p.v<0?CSSV('--neg'):CSSV('--pos'));
    const r=s_('rect',{x:x1,y,width:Math.max(1.5,x2-x1),height:bh,fill:col,rx:3});
    hov(r,()=>`<b>${p.label}</b><span class="tv">${p.type==='total'?num(p.v):sign(p.v)} tCO₂e</span>${p.note||''}`);
    sv.$plot.appendChild(r);
    sv.$plot.appendChild(s_('text',{x:-8,y:y+bh/2+3.5,cls:'axislab','text-anchor':'end',
      text:p.label.length>36?p.label.slice(0,35)+'…':p.label}));
    sv.$plot.appendChild(s_('text',{x:x2+6,y:y+bh/2+3.5,cls:'vlab','text-anchor':'start',
      text:p.type==='total'?compact(p.v):(p.v>0?'+':'')+compact(p.v)}));
    if(i<pts.length-1 && p.type!=='total'){
      sv.$plot.appendChild(s_('line',{x1:X(p.to),x2:X(p.to),y1:y+bh,y2:y+rh,stroke:CSSV('--hair2'),'stroke-width':1}));
    }
  });
  return sv;
}

function chHeat(o){
  const rows=o.rows, cols=o.cols, cw=o.cw||96, rh=o.rh||24, lw=o.lw||236;
  const w=lw+cols.length*cw+16, h=rows.length*rh+52;
  const sv=frame(w,h,{t:44,r:16,b:8,l:lw});
  const mx=o.max||Math.max(...rows.flatMap(r=>cols.map(c=>r.v[c]||0)));
  const ramp=['--seq1','--seq2','--seq3','--seq4','--seq5','--seq6','--seq7'].map(CSSV);
  cols.forEach((c,j)=> sv.$plot.appendChild(s_('text',{x:j*cw+cw/2,y:-24,cls:'axislab','text-anchor':'middle',text:c,'font-weight':600})));
  rows.forEach((r,i)=>{
    sv.$plot.appendChild(s_('text',{x:-8,y:i*rh+rh/2+3.5,cls:'axislab','text-anchor':'end',
      text:r.label.length>36?r.label.slice(0,35)+'…':r.label}));
    cols.forEach((c,j)=>{
      const v=r.v[c];
      const t=mx?Math.min(1,(v||0)/mx):0;
      const idx=Math.min(ramp.length-1, Math.floor(t*ramp.length*0.999));
      const cell=s_('rect',{x:j*cw+1,y:i*rh+1,width:cw-3,height:rh-3,rx:2,
        fill: v?ramp[idx]:CSSV('--plane'), stroke:CSSV('--panel'),'stroke-width':1});
      hov(cell,()=>`<b>${r.label}</b> · ${c}<span class="tv">${(v||0).toFixed(1)}%</span>${o.tnote?o.tnote(r,c):''}`);
      sv.$plot.appendChild(cell);
      sv.$plot.appendChild(s_('text',{x:j*cw+cw/2,y:i*rh+rh/2+3.5,cls:'vlab','text-anchor':'middle',
        fill: t>0.55?CSSV('--paper'):CSSV('--ink2'), text:(v||0).toFixed(1)}));
    });
  });
  return sv;
}

function chBullet(o){
  const rows=o.rows, lw=o.lw||226, rh=o.rh||30, w=o.w||660;
  const h=rows.length*rh+16;
  const sv=frame(w,h,{t:8,r:56,b:8,l:lw});
  const iw=sv.$iw;
  rows.forEach((r,i)=>{
    const y=i*rh, mid=y+rh/2;
    const span=Math.max(r.target,r.value,r.baseline||0)*1.06 || 1;
    const X=v=>Math.max(0,Math.min(iw, v/span*iw));
    sv.$plot.appendChild(s_('rect',{x:0,y:mid-8,width:iw,height:16,fill:CSSV('--plane'),rx:3}));
    sv.$plot.appendChild(s_('rect',{x:0,y:mid-8,width:X(r.target),height:16,fill:CSSV('--mid'),rx:3}));
    const bar=s_('rect',{x:0,y:mid-4.5,width:Math.max(2,X(r.value)),height:9,fill:r.met?CSSV('--ink'):CSSV('--accent'),rx:2.5});
    hov(bar,()=>`<b>${r.label}</b><span class="tv">${r.vlabel}</span>target ${r.tlabel} · ${r.met?'met':'not met'}`);
    sv.$plot.appendChild(bar);
    sv.$plot.appendChild(s_('line',{x1:X(r.target),x2:X(r.target),y1:mid-11,y2:mid+11,stroke:CSSV('--ink'),'stroke-width':2.5}));
    sv.$plot.appendChild(s_('text',{x:-8,y:mid+3.5,cls:'axislab','text-anchor':'end',
      text:r.label.length>38?r.label.slice(0,37)+'…':r.label}));
    sv.$plot.appendChild(s_('text',{x:iw+6,y:mid+3.5,cls:'vlab','text-anchor':'start',text:r.vlabel}));
  });
  return sv;
}

function chBubble(o){
  const w=o.w||760,h=o.h||400,m={t:26,r:24,b:44,l:62};
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  const xs=o.pts.map(p=>p.x), ys=o.pts.map(p=>p.y);
  const sx=nice(Math.max(...xs),0), sy=nice(Math.max(...ys),Math.min(...ys));
  const X=v=>(v-sx.lo)/(sx.hi-sx.lo)*iw, Y=v=>ih-(v-sy.lo)/(sy.hi-sy.lo)*ih;
  ticks(sy.lo,sy.hi,sy.step).forEach(v=>{
    sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:Y(v),y2:Y(v),cls:'grid'}));
    sv.$plot.appendChild(s_('text',{x:-8,y:Y(v)+3.5,cls:'axislab tn','text-anchor':'end',text:v.toFixed(0)+'%'}));
  });
  ticks(sx.lo,sx.hi,sx.step).forEach(v=>{
    sv.$plot.appendChild(s_('text',{x:X(v),y:ih+16,cls:'axislab tn','text-anchor':'middle',text:v.toFixed(0)+'%'}));
  });
  sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:ih,y2:ih,cls:'base'}));
  if(o.qx!==undefined){
    sv.$plot.appendChild(s_('line',{x1:X(o.qx),x2:X(o.qx),y1:0,y2:ih,stroke:CSSV('--hair2'),'stroke-width':1,'stroke-dasharray':'4 4'}));
    sv.$plot.appendChild(s_('text',{x:X(o.qx)+5,y:12,cls:'axislab',text:o.qxlabel||''}));
  }
  if(o.qy!==undefined){
    sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:Y(o.qy),y2:Y(o.qy),stroke:CSSV('--hair2'),'stroke-width':1,'stroke-dasharray':'4 4'}));
    sv.$plot.appendChild(s_('text',{x:iw-4,y:Y(o.qy)-5,cls:'axislab','text-anchor':'end',text:o.qylabel||''}));
  }
  const rmax=Math.max(...o.pts.map(p=>p.r));
  const blab=[];
  o.pts.slice().sort((a,b)=>b.r-a.r).forEach(p=>{
    const rr=6+Math.sqrt(p.r/rmax)*30;
    const c=s_('circle',{cx:X(p.x),cy:Y(p.y),r:rr,fill:p.color,'fill-opacity':0.22+0.5*(p.conf/100),
      stroke:p.color,'stroke-width':2});
    hov(c,()=>`<b>${p.label}</b><span class="tv">${compact(p.r)} tCO₂e · ${p.x.toFixed(1)}% of footprint</span>`+
      `${p.y.toFixed(1)}%/yr change · confidence ${p.conf}/100`);
    sv.$plot.appendChild(c);
    if(p.name) blab.push({x:X(p.x),y:Y(p.y)-rr-5,text:p.name});
  });
  blab.sort((a,b)=>a.y-b.y);
  for(let i=1;i<blab.length;i++) if(Math.abs(blab[i].x-blab[i-1].x)<130 && blab[i].y-blab[i-1].y<13) blab[i].y=blab[i-1].y+13;
  blab.forEach(l=>sv.$plot.appendChild(s_('text',{x:Math.max(30,Math.min(iw-30,l.x)),y:Math.max(11,l.y),cls:'serieslab','text-anchor':'middle',text:l.text})));
  sv.$plot.appendChild(s_('text',{x:iw/2,y:ih+34,cls:'axislab','text-anchor':'middle',text:o.xlabel||''}));
  sv.$plot.appendChild(s_('text',{x:-8,y:-8,cls:'axislab','text-anchor':'end',text:o.ylabel||''}));
  return sv;
}

function chSankey(o){
  const w=o.w||880, h=o.h||420, m={t:14,r:8,b:8,l:8};
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  const colW=o.colW||150, gap=10;
  const cols=o.cols;
  const totals=cols.map(c=>c.nodes.reduce((a,n)=>a+n.v,0));
  const maxTotal=Math.max(...totals);
  const layout=cols.map((c,ci)=>{
    const t=totals[ci], avail=ih-(c.nodes.length-1)*gap;
    let y=(ih-(avail*t/maxTotal+(c.nodes.length-1)*gap))/2;
    return c.nodes.map(n=>{
      const nh=Math.max(3, n.v/maxTotal*avail);
      const box={...n, y, h:nh, x:ci*((iw-colW)/(cols.length-1)), ci};
      y+=nh+gap; return box;
    });
  });
  const find=(ci,id)=>layout[ci].find(n=>n.id===id);
  (o.links||[]).forEach(L=>{
    const a=find(L.from[0],L.from[1]), b=find(L.to[0],L.to[1]);
    if(!a||!b) return;
    const ax=a.x+colW, bx=b.x;
    const th=Math.max(2, L.v/maxTotal*(ih-(cols[0].nodes.length-1)*gap));
    const ay=(L.ay!==undefined?L.ay:a.y+a.h/2), by=(L.by!==undefined?L.by:b.y+b.h/2);
    const p=s_('path',{d:`M${ax},${ay-th/2} C${ax+60},${ay-th/2} ${bx-60},${by-th/2} ${bx},${by-th/2} L${bx},${by+th/2} C${bx-60},${by+th/2} ${ax+60},${ay+th/2} ${ax},${ay+th/2} Z`,
      fill:L.color||CSSV('--hair2'),'fill-opacity':.42});
    hov(p,()=>`<b>${a.label} → ${b.label}</b><span class="tv">${compact(L.v)} tCO₂e</span>`);
    sv.$plot.appendChild(p);
  });
  layout.forEach((colNodes,ci)=>{
    colNodes.forEach(n=>{
      const r=s_('rect',{x:n.x,y:n.y,width:colW,height:n.h,fill:n.color||CSSV('--ink'),rx:3});
      hov(r,()=>`<b>${n.label}</b><span class="tv">${compact(n.v)} tCO₂e</span>${n.note||''}`);
      sv.$plot.appendChild(r);
      if(n.h>13){
        sv.$plot.appendChild(s_('text',{x:n.x+8,y:n.y+n.h/2-1,cls:'serieslab',fill:CSSV('--paper'),text:n.label.length>21?n.label.slice(0,20)+'…':n.label}));
        sv.$plot.appendChild(s_('text',{x:n.x+8,y:n.y+n.h/2+12,cls:'vlab',fill:CSSV('--paper'),'fill-opacity':.85,text:compact(n.v)}));
      } else {
        sv.$plot.appendChild(s_('text',{x:n.x+colW+6,y:n.y+n.h/2+3.5,cls:'vlab',text:n.label+' '+compact(n.v)}));
      }
    });
  });
  cols.forEach((c,ci)=>{
    const x=ci*((iw-colW)/(cols.length-1));
    sv.$plot.appendChild(s_('text',{x:x,y:-2,cls:'axislab','font-weight':600,text:c.title}));
  });
  return sv;
}

function chSlope(o){
  const w=o.w||460,h=o.h||300,m={t:24,r:o.rpad||130,b:24,l:o.lpad||58};
  const sv=frame(w,h,m), iw=sv.$iw, ih=sv.$ih;
  const vals=o.rows.flatMap(r=>[r.a,r.b]).filter(v=>v!==null&&v!==undefined);
  const sc=nice(Math.max(...vals),o.zero===false?Math.min(...vals):0);
  const Y=v=>ih-(v-sc.lo)/(sc.hi-sc.lo)*ih;
  ticks(sc.lo,sc.hi,sc.step).forEach(v=>{
    sv.$plot.appendChild(s_('line',{x1:0,x2:iw,y1:Y(v),y2:Y(v),cls:'grid'}));
    sv.$plot.appendChild(s_('text',{x:-8,y:Y(v)+3.5,cls:'axislab tn','text-anchor':'end',text:o.yfmt?o.yfmt(v):compact(v)}));
  });
  sv.$plot.appendChild(s_('text',{x:0,y:-8,cls:'axislab','font-weight':600,text:o.alabel}));
  sv.$plot.appendChild(s_('text',{x:iw,y:-8,cls:'axislab','text-anchor':'end','font-weight':600,text:o.blabel}));
  const lab=[];
  o.rows.forEach(r=>{
    if(r.a===null||r.b===null||r.a===undefined||r.b===undefined) return;
    const col=r.color||CSSV('--ink2');
    const g=s_('g',{});
    g.appendChild(s_('line',{x1:0,x2:iw,y1:Y(r.a),y2:Y(r.b),stroke:col,'stroke-width':2.2,'stroke-linecap':'round'}));
    g.appendChild(s_('circle',{cx:0,cy:Y(r.a),r:4,fill:col,stroke:CSSV('--panel'),'stroke-width':2}));
    g.appendChild(s_('circle',{cx:iw,cy:Y(r.b),r:4,fill:col,stroke:CSSV('--panel'),'stroke-width':2}));
    lab.push({y:Y(r.b),color:col,text:`${r.label} ${o.lfmt?o.lfmt(r.b):compact(r.b)}`});
    hov(g,()=>`<b>${r.label}</b><span class="tv">${o.lfmt?o.lfmt(r.a):compact(r.a)} → ${o.lfmt?o.lfmt(r.b):compact(r.b)}</span>${o.tnote?o.tnote(r):''}`);
    sv.$plot.appendChild(g);
  });
  lab.sort((a,b)=>a.y-b.y);
  for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<13) lab[i].y=lab[i-1].y+13;
  const ov=lab.length?lab[lab.length-1].y-ih:0;
  if(ov>0) lab.forEach(l=>l.y-=Math.min(ov,lab[0].y));
  lab.forEach(l=>sv.$plot.appendChild(s_('text',{x:iw+8,y:l.y+3.5,cls:'serieslab',fill:l.color,text:l.text})));
  return sv;
}

function chFunnel(o){
  const w=o.w||660, rh=o.rh||62, h=o.stages.length*rh+20;
  const gut=o.gutter||168;
  const sv=frame(w,h,{t:8,r:gut,b:8,l:8});
  const iw=sv.$iw;
  const mx=Math.max(...o.stages.map(s=>s.v||0));
  o.stages.forEach((st,i)=>{
    const y=i*rh+4, bh=rh-16;
    const bw=st.v?Math.max(24,st.v/mx*iw):iw;
    if(st.v===null||st.v===undefined){
      sv.$plot.appendChild(s_('rect',{x:0,y,width:iw,height:bh,fill:'none',stroke:CSSV('--accent'),'stroke-width':1.5,'stroke-dasharray':'6 5',rx:4}));
      sv.$plot.appendChild(s_('text',{x:12,y:y+bh/2-2,cls:'serieslab',fill:CSSV('--accent-ink'),text:st.label}));
      sv.$plot.appendChild(s_('text',{x:12,y:y+bh/2+13,cls:'vlab',fill:CSSV('--ink3'),text:'not disclosed — the funnel cannot be completed from public data'}));
    } else {
      const col=CSSV(['--seq6','--seq5','--seq4','--seq3'][Math.min(3,i)]);
      const r=s_('rect',{x:0,y,width:bw,height:bh,fill:col,rx:4});
      hov(r,()=>`<b>${st.label}</b><span class="tv">${num(st.v)} t</span>${st.note||''}`);
      sv.$plot.appendChild(r);
      const roomy = bw>300;
      sv.$plot.appendChild(s_('text',{x:roomy?12:bw+10,y:y+bh/2-2,cls:'serieslab',
        fill:roomy?CSSV('--paper'):CSSV('--ink'),text:st.label}));
      sv.$plot.appendChild(s_('text',{x:roomy?12:bw+10,y:y+bh/2+13,cls:'vlab',
        fill:roomy?CSSV('--paper'):CSSV('--ink2'),'fill-opacity':roomy?.9:1,
        text:num(st.v)+' t · '+(st.v/mx*100).toFixed(1)+'% of generated'}));
      if(i>0 && o.stages[i-1].v){
        const loss=o.stages[i-1].v-st.v;
        if(loss>0){
          sv.$plot.appendChild(s_('text',{x:iw+gut-14,y:y+bh/2-2,cls:'vlab','text-anchor':'end',
            fill:CSSV('--accent-ink'),text:'−'+num(loss)+' t'}));
          sv.$plot.appendChild(s_('text',{x:iw+gut-14,y:y+bh/2+12,cls:'vlab','text-anchor':'end',
            fill:CSSV('--ink3'),text:st.lossLabel||''}));
        }
      }
    }
  });
  return sv;
}
window.__CH = {chLine,chBar,chHBar,chStack,chWaterfall,chHeat,chBullet,chBubble,chSankey,chSlope,chFunnel,
  el,s_,ap,hov,CSSV,num,compact,sign,pctf,B,D,RQ,ANN,PROV,INS,Y6,Y11,$,wrapText,nice};
})();

<script>
(function(){
"use strict";
const K = window.__CH;
const {chLine,chBar,chHBar,chStack,chWaterfall,chHeat,chBullet,chBubble,chSankey,chSlope,chFunnel,
  el,s_,ap,hov,CSSV,num,compact,sign,pctf,B,D,RQ,ANN,PROV,INS,Y6,Y11,$} = K;

let BASIS='latest', YEAR='FY25';
const listeners=[];
const onState = f => listeners.push(f);

/* ---------- panel scaffold ---------- */
function panel(o){
  const body = el('div',{cls:'plot'});
  const tools = el('div',{cls:'ptools'});
  if(o.grade) tools.appendChild(el('span',{cls:'grade '+o.grade,text:o.grade}));
  if(o.table){
    const tw = el('div',{cls:'tblwrap',hidden:true});
    tw.hidden=true;
    const tb = el('button',{cls:'chip','aria-pressed':'false',text:'Data',onclick:()=>{
      const on = tb.getAttribute('aria-pressed')==='true';
      tb.setAttribute('aria-pressed', on?'false':'true');
      tw.hidden = on;
      if(!on && !tw.dataset.filled){ tw.appendChild(o.table()); tw.dataset.filled='1'; }
    }});
    tools.appendChild(tb); o.$table=tw;
  }
  if(o.prov){
    tools.appendChild(el('button',{cls:'chip',text:'Source',onclick:()=>openProv(o.prov,o.title)}));
  }
  const head = el('div',{cls:'phead'},[
    el('h3',{},[ o.kicker?el('span',{cls:'kicker',text:o.kicker}):null, o.title ]),
    tools
  ]);
  const p = el('div',{cls:'panel'},[head]);
  if(o.lede) p.appendChild(el('p',{cls:'note',html:o.lede}));
  if(o.legend) p.appendChild(o.legend);
  p.appendChild(body);
  if(o.$table) p.appendChild(o.$table);
  if(o.after) p.appendChild(o.after);
  if(o.ann) p.appendChild(story(o.ann));
  p.$body = body;
  return p;
}
function story(a){
  return el('dl',{cls:'story'},[
    el('div',{},[el('dt',{text:'What changed'}), el('dd',{text:a.what})]),
    el('div',{},[el('dt',{text:'Why it matters'}), el('dd',{text:a.why})]),
    el('div',{},[el('dt',{text:'Investigate next'}), el('dd',{text:a.next})]),
    el('div',{},[el('dt',{text:'Caveat'}), el('dd',{text:a.caveat})])
  ]);
}
function legend(items){
  return el('ul',{cls:'legend'}, items.map(i=>el('li',{},[
    el('span',{cls:'swatch'+(i.line?' line':''),style:`background:${i.color}`}), i.label ])));
}
function tbl(head, rows){
  const t=el('table',{cls:'dt'});
  t.appendChild(el('thead',{},el('tr',{},head.map(h=>el('th',{text:h})))));
  t.appendChild(el('tbody',{},rows.map(r=>el('tr',{},r.map(c=>el('td',{html:String(c)}))))));
  return t;
}

/* ---------- provenance drawer ---------- */
const drawer=$('#drawer'), scrim=$('#scrim');
function openProv(id,title){
  const p=PROV[id]; if(!p) return;

function indexTo100(obj,base){
  const b=obj[base]; const o={};

}

function view1(){

      const dprev = (cur!==null&&prev!==null&&cur!==undefined&&prev!==undefined)?cur-prev:null;
      const dbase = (cur!==null&&base!==null&&base!==undefined)?cur-base:null;
      const isPct = t.unit==='%';
      const isCount = t.unit==='count';
      const down = t.direction==='decrease';

      const dfmt = (a,b) => (a===null||a===undefined||b===null||b===undefined) ? '—'
        : isPct ? sign(a-b)+' p.p.'
        : isCount ? sign(a-b)
        : (b ? pctf((a-b)/b*100) : sign(a-b));
      const good = dprev===null?null:(down? dprev<0 : dprev>0);
      kg.appendChild(el('div',{cls:'kpi'},[

          el('span',{cls:'pill '+(t.status==='Target Achieved'?'met':'miss'),

        el('div',{cls:'kstat'},[
          el('span',{cls:'kval',text:fmt(cur)}),
          el('span',{cls:'kunit',text:t.unit==='%'?'':t.unit})
        ]),
        el('div',{cls:'krow'},[
          el('span',{html:`Baseline ${t.baseline_year} <b>${fmt(base)}</b>`}),
          el('span',{html:`Target <b>${t.target_unit?t.target_label+'%':fmt(t.required)}</b>`})
        ]),
        el('div',{cls:'krow'},[
          el('span',{html:`vs prior <b>${dfmt(cur,prev)}</b>`}),
          el('span',{html:`vs baseline <b>${dfmt(cur,base)}</b>`})
        ]),
        el('div',{cls:'krow'},[
          el('span',{text: down?'Lower is better':'Higher is better'}),
          el('span',{text:'FY25 p.'+t.page})
        ])
      ]));
    });
  };
  build(); onState(build);
  wrap.appendChild(panel({kicker:'Target scoreboard', title:'Every FY25 quantitative target, as reported',
    grade:'descriptive', prov:'kpi_matrix',
    lede:'Cards show the level, the baseline, the required FY25 level, and both deltas. <b>Met</b> and <b>Missed</b> are NIKE&rsquo;s own printed verdicts, not a recomputation. The basis toggle in the header swaps the FY25 vintage for the FY24 vintage wherever both exist.',
    ann:ANN.kpi_matrix, after:kg}));

  // Attainment matrix (bullet)
  const bp=panel({kicker:'Attainment', title:'Distance to target, on a normalised scale',
    grade:'descriptive', prov:'kpi_matrix', ann:ANN.target_trajectories,
    lede:'Each bar is progress toward the required FY25 level; the vertical rule is the target. '+
      'Completion is <span class="calc" style="display:inline;padding:1px 5px">(latest − baseline) ÷ (required level − baseline)</span>, so it can pass 100%.',
    table:()=>tbl(['Target','Baseline','Required FY25','FY25','Completion','Attainment','Shape','NIKE verdict'],
      D.targets.map(t=>[t.name, compact(t.baseline,1), compact(t.required,1), compact(t.latest['FY25'],1),
        (t.completion*100).toFixed(0)+'%', t.attainment, t.shape, t.status]))});
  const drawBul=()=>{
    bp.$body.innerHTML='';
    const rows = D.targets.map(t=>({
      label:t.name, value:Math.max(0,Math.min(1.6,t.completion)), target:1, met:t.status==='Target Achieved',
      vlabel:(t.completion*100).toFixed(0)+'%', tlabel:'100%'

    grade:'descriptive', prov:'kpi_matrix',
    lede:'Each target expressed as the share of its own required change completed, so seventeen different units '+
      'sit on one axis. 0% is the baseline, 100% is the target, and a line can go above or below both.',
    legend:legend([{color:'var(--accent)',label:'Met',line:true},{color:'var(--ink3)',label:'Missed',line:true},
      {color:'var(--ref)',label:'Required FY25 level',line:true}])});
  const drawTraj=()=>{
    tp.$body.innerHTML='';
    const ys=yrs();
    const series=D.targets.map(t=>{
      const v={}; ys.forEach(y=> v[y]= t.normalised[y]===null||t.normalised[y]===undefined?null:t.normalised[y]*100);
      return {name:t.name, short:'', v, color:t.status==='Target Achieved'?CSSV('--accent'):CSSV('--ink3'),
        wt:1.6, op:.85, label:false};
    }).filter(t=>Object.values(t.v).some(x=>x!==null));
    tp.$body.appendChild(chLine({cats:ys, series, w:640, h:280, ylim:[-100,220], yticks:4,
      yfmt:v=>v.toFixed(0)+'%', tfmt:v=>v.toFixed(0)+'% of the required change',
      ylabel:'% of required change completed',
      markers:[{v:100,label:'target reached',color:CSSV('--ref')},{v:0,label:'baseline',color:CSSV('--ink3')}]}));
    tp.$body.appendChild(el('p',{cls:'note',html:
      'The axis is bounded at −100% and +220%. Two series run past it: <b>Foundational Expectations</b> falls to −567% in FY22, because its required change is only 6 points from a 94% baseline, so a normal-sized swing in the percentage becomes an enormous normalised one; and <b>materials GHG abatement</b> peaks at 232%. Both are shown in full in the attainment chart above.'}));
  };
  drawTraj(); onState(drawTraj); two.appendChild(tp);

  const mp=panel({kicker:'Movement', title:'Largest FY24 to FY25 moves, in units of the required change',
    grade:'diagnostic', prov:'kpi_matrix',

  const drawMov=()=>{
    mp.$body.innerHTML='';

    const rows=D.targets.filter(t=>t.last_step!==null).map(t=>({label:t.name,v:t.last_step,
      color:t.last_step<0?CSSV('--neg'):CSSV('--accent'), note:`shape: ${t.shape}`}))
      .sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,10);
    mp.$body.appendChild(chHBar({rows, w:600, lw:210, afmt:v=>v.toFixed(2), lfmt:v=>v.toFixed(2),
      tfmt:v=>v.toFixed(3)+' of required change'}));
  };
  drawMov(); onState(drawMov); two.appendChild(mp);
  wrap.appendChild(two);

  // Gaps + alerts
  const two2=el('div',{cls:'cols2'});
  const gp=panel({kicker:'Remaining gap', title:'The six targets that were missed, by how much',
    grade:'descriptive', prov:'kpi_matrix',
    lede:'Share of the required change still outstanding at FY25.'});
  const drawGap=()=>{
    gp.$body.innerHTML='';
    const rows=D.targets.filter(t=>t.status!=='Target Achieved')

        note:`${(t.completion*100).toFixed(0)}% complete · ${t.shape}`}))
      .sort((a,b)=>b.v-a.v);
    gp.$body.appendChild(chHBar({rows,w:600,lw:220,afmt:v=>v.toFixed(0)+'%',lfmt:v=>v.toFixed(0)+'%',
      tfmt:v=>v.toFixed(1)+'% of the required change outstanding'}));
  };
  drawGap(); onState(drawGap); two2.appendChild(gp);

  const ap2=panel({kicker:'Data trust', title:'Restatement and quality alerts',
    grade:'descriptive', prov:'lineage',
    lede:'Raised automatically by the reconciliation and quality-control layers. Full detail in View 06.'});
  const rs=D.recon_summary, qs=D.qc_summary;
  ap2.$body.appendChild(el('div',{cls:'cols3'},[
    alertCard(String(rs.restatement||0),'values restated between the two report vintages',
      'Corporate jets and commercial air travel gained radiative forcing; the FY20&ndash;FY24 Scope 1 and Scope 3 series moved with them.'),
    alertCard(String((qs.fail||0)+(qs.warn||0)),'open quality-control flags',
      `${qs.fail||0} internal inconsistencies between two printed figures, ${qs.warn||0} comparability hazards.`),
    alertCard(String(D.methodology_changes.length),'methodology or scope changes on the register',
      'Each one is dated, sourced, and tied to the series it moves.'),
    alertCard(D.validation.filter(v=>v.match_status==='match').length+'/'+D.validation.length,'validation checks passing',
      'Observations read directly off the PDF and compared with the processed dataset.'),
    alertCard(num(D.coverage.rows),'observations in the tidy dataset',
      `${D.coverage.metrics} metrics across ${D.coverage.tables} source tables, both report vintages.`),
    alertCard('9','metrics under limited assurance',
      'Everything else in these six views is unassured reported data.')
  ]));
  two2.appendChild(ap2);
  wrap.appendChild(two2);
  return wrap;
}
function alertCard(big,label,body){
  return el('div',{cls:'kpi'},[
    el('div',{cls:'kstat'},[el('span',{cls:'kval',text:big})]),
    el('div',{cls:'kname',text:label}),
    el('p',{cls:'note',html:body,style:'margin-top:0'})
  ]);
}
window.__UI={panel,story,legend,tbl,onState,openProv,alertCard,

  fire:()=>listeners.forEach(f=>{try{f()}catch(e){console.error(e)}}), reset:()=>{listeners.length=0;}};
window.__V1=view1;
})();

<script>
(function(){
