    onclick:()=>{ ysel.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',
      x.dataset.year===y?'true':'false')); U.setYear(y); drawPar(); }})));
  pp.insertBefore(el('div',{cls:'ctl',style:'margin:0 0 12px'},[
    el('label',{text:'Year'}), ysel]), pp.$body);
  const drawPar=()=>{
    pp.$body.innerHTML='';
    const y = yrs11().includes(year())?year():yrs11()[yrs11().length-1];
    const rows=TIERS.map(k=>({label:k,v:S3(k)[y]})).filter(r=>r.v).sort((a,b)=>b.v-a.v).slice(0,12);
    const tot=rows.reduce((a,r)=>a+r.v,0);
    let cum=0; rows.forEach(r=>{cum+=r.v; r.note=`${(r.v/tot*100).toFixed(1)}% of shown · cumulative ${(cum/tot*100).toFixed(1)}%`;});
    pp.$body.appendChild(chHBar({rows:rows.map((r,i)=>({...r,color:SEQ(Math.max(1,6-Math.floor(i/2.4)))})),
      w:620,lw:200,rh:22,tfmt:v=>num(v)+' tCO₂e'}));
    pp.$body.appendChild(el('p',{cls:'note',html:
      `<b>${y}</b> · top three are ${(rows.slice(0,3).reduce((a,r)=>a+r.v,0)/tot*100).toFixed(0)}% of the twelve shown. `+
      `Across all disclosed sources the effective number of contributors is ${RQ.rq9.blocks[0].effective_number_of_sources}.`}));
  };
  drawPar(); onState(drawPar); two.appendChild(pp);

  const tp=panel({kicker:'Tiers', title:'Tier trajectories, indexed to FY20',
    grade:'descriptive', prov:'tier_trajectories',
    lede:'Tier 3 footwear is the only large line above its FY20 level.',
    legend:legend([{color:'var(--accent)',label:'Above FY20',line:true},{color:'var(--ref)',label:'Below FY20',line:true}])});
  const drawTier=()=>{
    tp.$body.innerHTML='';
    const ys=yrs11().slice(5);
    const keys=['Tier 1 Footwear','Tier 2 Apparel','Tier 3 Footwear','Tier 3 Apparel','Tier 4 Footwear','Tier 4 Apparel','Logistics'];
    const series=keys.map(k=>{
      const raw=S3(k), v=indexTo100(pick(raw,ys),'FY20');
      const lastv=v[ys[ys.length-1]];
      return {name:k.replace('Tier ','T').replace(' Footwear',' FW').replace(' Apparel',' AP'),
        v, color:lastv>100?CSSV('--accent'):CSSV('--ref'), wt:2, op:.9};
    });
    tp.$body.appendChild(chLine({cats:ys, series, w:600,h:280, zero:false, rpad:64,
      yfmt:v=>v.toFixed(0), tfmt:v=>v.toFixed(0)+' (FY20=100)', ylabel:'index, FY20 = 100',
      markers:[{v:100,label:'FY20',color:CSSV('--ink3')}]}));
  };
  drawTier(); onState(drawTier); two.appendChild(tp);
  wrap.appendChild(two);

  /* mfg vs logistics slope + renewable */
  const two2=el('div',{cls:'cols2'});
  const mp=panel({kicker:'Target components', title:'Manufacturing and transportation target, FY20 to FY25',
    grade:'descriptive', prov:'carbon_waterfall',
    lede:'The six component lines NIKE discloses for the 0%-change target. Note that for FY24 and FY25 these no longer sum to the printed headline; see View 06.',
    table:()=>tbl(['Component',...Y6], Object.entries(D.mfg_log).map(([k,v])=>[k,...Y6.map(y=>num(v[y]))]))});
  const drawMfg=()=>{
    mp.$body.innerHTML='';
    const src=basis()==='latest'?D.mfg_log:D.mfg_log_orig;
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const rows=Object.entries(src).map(([k,v],i)=>({label:k.replace(/\(Focus Factories\)/,'').replace('Tier 1 - ','T1 ').replace('Tier 2 - ','T2 ').replace('Logistics - ','').trim(),
      a:v[ys[0]], b:v[ys[ys.length-1]], color:[SEQ(6),SEQ(5),SEQ(4),SEQ(3),CSSV('--accent'),CSSV('--ink2')][i]}));
    mp.$body.appendChild(chSlope({rows,alabel:ys[0],blabel:ys[ys.length-1],w:600,h:300,rpad:168,
      lfmt:v=>compact(v), tnote:r=>`<br>${pctf((r.b-r.a)/r.a*100)}`}));
  };
  drawMfg(); onState(drawMfg); two2.appendChild(mp);

  const rp=panel({kicker:'Energy transition', title:'Renewable penetration: owned vs supplier',
    grade:'descriptive', prov:'renewable_transition', ann:ANN.renewable_transition,
    lede:'Two shares on one scale because both are percentages of their own total energy. '+
      'The owned curve has reached its ceiling; the supplier curve has 62 points of headroom.',
    legend:legend([{color:'var(--accent)',label:'Owned or operated electricity',line:true},
      {color:'var(--ref)',label:'Supplier electricity (T1 + T2)',line:true},
      {color:'var(--third)',label:'Supplier direct fuel',line:true},
      {color:'var(--ink3)',label:'Supplier energy, all sources',line:true}])});
  const rpen=RQ.rq2.renewable_penetration;
  rp.$body.appendChild(chLine({cats:Y6, w:620,h:280,
    series:[
      {name:'Owned electricity',short:'Owned',v:rpen.owned_electricity_pct,color:CSSV('--accent'),wt:2.6},
      {name:'Supplier electricity',short:'Supplier elec',v:rpen.supplier_electricity_pct,color:CSSV('--ref'),wt:2.2},
      {name:'Supplier direct fuel',short:'Supplier fuel',v:rpen.supplier_fuel_pct,color:CSSV('--third'),wt:2,dash:'6 4'},
      {name:'Supplier energy total',short:'Supplier all',v:rpen.supplier_energy_pct,color:CSSV('--ink3'),wt:1.8,dash:'2 4'}],
    yfmt:v=>v.toFixed(0)+'%', tfmt:v=>v+'% renewable', ylabel:'% renewable', rpad:96,
    markers:[{v:100,label:'100%',color:CSSV('--ink3')}]}));
  two2.appendChild(rp);
  wrap.appendChild(two2);

  /* leverage matrix */
  const lp=panel({kicker:'Leverage', title:'Carbon Leverage Matrix',
    grade:'diagnostic', prov:'leverage_matrix', ann:ANN.leverage_matrix,
    lede:'Horizontal: share of the FY25 footprint. Vertical: compound annual change FY20 to FY25, so lower is faster improvement. '+
      'Bubble area is absolute FY25 emissions; opacity is a data-confidence score built from primary-data share, assurance, series completeness and definition stability. '+
      'No quadrant is labelled good or bad.',
    table:()=>tbl(['Source','FY25 tCO₂e','Share','Change %/yr','Confidence','Quadrant'],
      RQ.rq2.nodes.filter(n=>n.fy25).sort((a,b)=>b.fy25-a.fy25).map(n=>[n.source,num(n.fy25),
        n.share_fy25.toFixed(2)+'%', n.improvement_rate_pct_per_year===null?'—':n.improvement_rate_pct_per_year.toFixed(1)+'%',
        n.confidence, n.quadrant]))});
  const drawLev=()=>{
    lp.$body.innerHTML='';
    const pts=RQ.rq2.nodes.filter(n=>n.fy25>0 && n.improvement_rate_pct_per_year!==null).map(n=>({
      label:n.source, name:(n.share_fy25>=5?n.source.replace('Tier ','T').replace(' Footwear',' FW').replace(' Apparel',' AP').replace(' market-based (owned or operated)','').replace(' (owned or operated)',''):''),
      x:n.share_fy25, y:n.improvement_rate_pct_per_year, r:n.fy25, conf:n.confidence,
      color: n.scope==='Scope 3'?CSSV('--ref'):CSSV('--accent')}));
    lp.$body.appendChild(chBubble({pts,w:840,h:420,qx:5,qy:-3,
      qxlabel:'5% of footprint',qylabel:'−3%/yr',
      xlabel:'Share of the FY25 footprint',ylabel:'compound annual change, FY20–FY25'}));
    lp.$body.appendChild(el('div',{cls:'cols2',style:'margin-top:14px'},
      Object.entries({
        'Large footprint, slow improvement':'Mass without momentum. The place a new programme has the most to work with and the least evidence that current effort is moving it.',
        'Large footprint, rapid improvement':'Already moving. Worth asking whether the rate came from abatement or from falling volume, and whether it can continue.',
        'Small footprint, slow improvement':'Cheap to ignore on tonnage, but often where a reputational or regulatory exposure sits.',
        'Small footprint, rapid improvement':'Finished work. The lever that produced it may be exhausted, as owned-and-operated now is.'
      }).map(([k,v])=>el('div',{cls:'kpi'},[el('div',{cls:'kname',text:k}),el('p',{cls:'note',text:v,style:'margin:0'})]))));
  };
  drawLev(); onState(drawLev); wrap.appendChild(lp);

  /* scenarios */
  const scp=panel({kicker:'2030 runway', title:'Scenario, not forecast: pathways to the FY30 Scope 3 target',
    grade:'scenario', prov:'scenario_runway', ann:ANN.scenario_runway,
    lede:`Scope 3 is ${compact(RQ.rq10.scope3.fy25)} tCO₂e against an FY30 target of ${compact(RQ.rq10.scope3.fy30_target)} implied by −30% from FY15. `+
      `The gap is ${num(RQ.rq10.scope3.remaining_gap)} tCO₂e, ${RQ.rq10.scope3.remaining_gap_pct}% of the current level. `+
      `None of these lines is a prediction.`,
    legend:legend([{color:'var(--ink)',label:'Linear',line:true},{color:'var(--ref)',label:'Constant %',line:true},
      {color:'var(--third)',label:'FY22–FY25 trend continued',line:true},{color:'var(--accent)',label:'FY30 target',line:true}]),
    table:()=>tbl(['Scenario','Assumption','What it requires'],
      RQ.rq10.scenarios.map(s=>[s.name, s.assumption,
        s.required_reduction_in_lever_pct!==undefined
          ? `${s.required_reduction_in_lever_pct}% of the ${compact(s.lever_fy25)} tCO₂e lever${s.feasible_within_lever?'':' — larger than the lever itself'}`
          : (s.required_annual_pct!==null&&s.required_annual_pct!==undefined?`${s.required_annual_pct}% a year`:`${num(s.required_annual_absolute)} tCO₂e a year`)]))});
  const SY=RQ.rq10.years;
  const mk=(id)=>{const s=RQ.rq10.scenarios.find(x=>x.id===id); const o={}; SY.forEach((y,i)=>o[y]=s.path[i]); return o;};
  scp.$body.appendChild(chLine({cats:SY,w:760,h:310,zero:false,rpad:132,
    series:[
      {name:'Linear',v:mk('linear'),color:CSSV('--ink'),wt:2.4},
      {name:'Constant %',v:mk('constant_pct'),color:CSSV('--ref'),wt:2,dash:'6 4'},
      {name:'FY22–25 trend',short:'Recent trend',v:mk('recent_trend_3y'),color:CSSV('--third'),wt:2,dash:'2 4'}],
    extra:[RQ.rq10.scope3.fy30_target*0.985, RQ.rq10.scope3.fy25*1.02],
    markers:[{v:RQ.rq10.scope3.fy30_target,label:'FY30 target '+compact(RQ.rq10.scope3.fy30_target),color:CSSV('--accent')}],
    yfmt:v=>compact(v),tfmt:v=>num(v)+' tCO₂e',ylabel:'Scope 3, metric tons CO₂e'}));
  const lev=RQ.rq10.scenarios.filter(s=>s.required_reduction_in_lever_pct!==undefined);
  scp.$body.appendChild(el('div',{cls:'cols3',style:'margin-top:16px'}, lev.map(s=>el('div',{cls:'kpi'},[
    el('div',{cls:'kname',text:s.name}),
    el('div',{cls:'kstat'},[el('span',{cls:'kval',text:s.required_reduction_in_lever_pct+'%'}),
      el('span',{cls:'kunit',text:'of that lever'})]),
    el('div',{cls:'krow'},[el('span',{html:`Lever FY25 <b>${compact(s.lever_fy25)}</b>`}),
      el('span',{html:`Footprint share <b>${s.lever_share_of_footprint}%</b>`})]),
    el('p',{cls:'note',style:'margin-top:2px',
      html: s.feasible_within_lever
        ? `Implies ${s.implied_annual_rate_pct}% a year for five years in this lever alone.`
        : `<b>Not feasible alone.</b> The gap is larger than the entire lever.`})
  ]))));
  wrap.appendChild(scp);
  return wrap;
}
window.__V2=view2;
})();
</script>
<script>
(function(){
"use strict";
const K=window.__CH, U=window.__UI;
const {chLine,chBar,chHBar,chStack,chWaterfall,chHeat,chBullet,chBubble,chSankey,chSlope,chFunnel,
  el,s_,hov,CSSV,num,compact,sign,pctf,D,RQ,ANN,Y6} = K;
const {panel,legend,tbl,onState,SEQ,indexTo100,pick} = U;
const basis=()=>U.getBasis();

/* ======================================================================
   VIEW 3 — MATERIALS + CIRCULARITY LAB
   ====================================================================== */
function view3(){
  const wrap=el('div',{cls:'stack'});
  wrap.appendChild(el('div',{cls:'viewhead'},[
    el('div',{cls:'eyebrow',text:'View 03 · Does substitution buy abatement?'}),
    el('h2',{text:'Materials + Circularity Lab'}),
    el('p',{text:'Material substitution is a share; circularity is a flow. Two questions that look like one, kept apart here, '+
      'along with the difference between less waste and more circularity.'})
  ]));

  /* material composition */
  const mp=panel({kicker:'Composition', title:'Volume of the five named materials',
    grade:'descriptive', prov:'material_vs_abatement',
    lede:'Total tabulated volume fell 9.7% in FY25. Rubber fell 24%, the steepest of the five. '+
      'Cotton and polyester cover NIKE Brand footwear, apparel and socks plus Converse; rubber, EVA foam and leather cover NIKE Brand footwear only.',
    legend:legend(['Polyester','Cotton','Rubber','EVA Foam','Leather'].map((m,i)=>({color:`var(--seq${6-i})`,label:m}))),
    table:()=>tbl(['Material','Component',...Y6],
      D.materials.flatMap(m=>[[m.material,'Total use',...Y6.map(y=>num(m.total[y]))],
        [m.material,'Preferred',...Y6.map(y=>num(m.preferred[y]))],
        [m.material,'Preferred share',...Y6.map(y=>m.preferred_share[y]===null?'—':m.preferred_share[y]+'%')]]))});
  const drawMat=()=>{
    mp.$body.innerHTML='';
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const keys=['Polyester','Cotton','Rubber','EVA Foam','Leather'];
    const v={}; keys.forEach(k=>{ const m=D.materials.find(x=>x.material===k); v[k]=pick(m.total,ys); });
    mp.$body.appendChild(chStack({cats:ys,keys,v,colors:[SEQ(6),SEQ(5),SEQ(4),SEQ(3),SEQ(2)],
      w:640,h:280,ylabel:'metric tons',tfmt:x=>num(x)+' t'}));
  };
  drawMat(); onState(drawMat); wrap.appendChild(mp);

  /* preferred penetration + epm vs abatement */
  const two=el('div',{cls:'cols2'});
  const pp=panel({kicker:'Substitution', title:'Preferred-material share by material',
    grade:'descriptive', prov:'material_vs_abatement',
    lede:'Computed as disclosed preferred components over total use. NIKE&rsquo;s own printed shares are in the data table and are never overwritten.'});
  const drawPref=()=>{
    pp.$body.innerHTML='';
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const cols=[CSSV('--accent'),CSSV('--ref'),CSSV('--third'),CSSV('--ink2'),CSSV('--ink3')];
    const series=D.materials.map((m,i)=>({name:m.material,short:m.material,v:pick(m.preferred_share,ys),
      color:cols[i],wt:2.1}));
    pp.$body.appendChild(chLine({cats:ys,series,w:600,h:280,rpad:84,
      yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v.toFixed(1)+'% preferred',ylabel:'% preferred'}));
  };
  drawPref(); onState(drawPref); two.appendChild(pp);

  const dp=panel({kicker:'The divergence', title:'EPM share against credited abatement',
    grade:'diagnostic', prov:'material_vs_abatement', ann:ANN.material_vs_abatement,
    lede:'Three panels rather than three lines on one axis, because a share, a tonnage of avoided emissions and a tonnage of material do not belong on the same scale. '+
      'Read the three together: the share clears its target in FY25 while abatement falls and volume falls with it.',
    table:()=>tbl(['Year','EPM share','Δ p.p.','Abatement tCO₂e','Δ','Same direction','Volume t','Δ volume'],
      D.divergence.map(d=>[d.year,d.epm_share+'%',sign(d.d_epm_pp),num(d.abatement),sign(d.d_abatement),
        d.same_direction?'yes':'<b>no</b>',num(d.total_material_volume),pctf(d.d_volume_pct)]))});
  dp.$body.appendChild(chLine({cats:Y6,w:600,h:150,rpad:66,
    series:[{name:'EPM share',short:'EPM %',v:D.epm,color:CSSV('--accent'),wt:2.4}],
    yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v+'% EPM',ylabel:'% environmentally preferred materials',
    markers:[{v:50,label:'50% target',color:CSSV('--ink3')}]}));
  dp.$body.appendChild(chLine({cats:Y6,w:600,h:150,rpad:66,
    series:[{name:'Materials GHG abatement',short:'Abatement',v:D.abatement,color:CSSV('--ref'),wt:2.4}],
    yfmt:v=>compact(v),tfmt:v=>num(v)+' tCO₂e avoided',ylabel:'materials GHG abatement, tCO₂e',
    markers:[{v:500000,label:'0.5M target',color:CSSV('--ink3')}]}));
  dp.$body.appendChild(chLine({cats:Y6,w:600,h:150,rpad:66,zero:false,
    series:[{name:'Tabulated volume',short:'Volume',v:D.material_volume_total,color:CSSV('--ink3'),wt:2.2}],
    yfmt:v=>compact(v),tfmt:v=>num(v)+' t',ylabel:'tabulated material volume, tonnes'}));
  dp.$body.appendChild(el('div',{cls:'calc',style:'margin-top:12px',
    html:'FY24 → FY25 &nbsp; EPM share 48% → 51% (+3 p.p.) &nbsp;·&nbsp; abatement 1,033,811 → 892,068 tCO₂e (−13.7%) &nbsp;·&nbsp; tabulated volume 528,683 → 477,584 t (−9.7%)'}));
  two.appendChild(dp);
  wrap.appendChild(two);

  /* hypotheses */
  wrap.appendChild(panel({kicker:'Hypotheses', title:'Six mechanisms that would produce this divergence',
    grade:'diagnostic', prov:'material_vs_abatement',
    lede:'None of these can be tested with the published data. They are listed so the next analyst knows what to ask for, and they are labelled hypotheses everywhere they appear.',
    after:el('ol',{style:'margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px'},
      RQ.rq3.hypotheses.map(h=>el('li',{cls:'note',style:'margin:0;font-size:12.8px',text:h})))}));

  /* LESS WASTE vs MORE CIRCULARITY */
  const two2=el('div',{cls:'cols2'});
  const wp=panel({kicker:'Less waste', title:'Waste intensity, diversion and recycling',
    grade:'descriptive', prov:'circularity_funnel',
    lede:'Three target series. Diversion has been flat at 98% for three years against a 100% target; recycling is at 76% against 80%.',
    legend:null});
  const wt=D.targets.find(t=>t.id==='waste_per_unit'), wd=D.targets.find(t=>t.id==='waste_diverted_pct'),
        wr=D.targets.find(t=>t.id==='waste_recycled_pct');
  wp.$body.appendChild(chLine({cats:Y6,w:600,h:160,zero:false,rpad:70,
    series:[{name:'Waste per unit',short:'g/unit',v:wt.latest,color:CSSV('--accent'),wt:2.3}],
    yfmt:v=>v.toFixed(0),tfmt:v=>v+' g/unit',ylabel:'waste per unit, grams',
    markers:[{v:wt.required,label:'target '+wt.required.toFixed(1)+' g',color:CSSV('--ink3')}]}));
  wp.$body.appendChild(chLine({cats:Y6,w:600,h:190,zero:false,rpad:78,
    series:[
      {name:'% diverted',short:'% diverted',v:wd.latest,color:CSSV('--ref'),wt:2.3},
      {name:'% recycled',short:'% recycled',v:wr.latest,color:CSSV('--third'),wt:2.3}],
    yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v+'%',ylabel:'% of waste',
    markers:[{v:100,label:'100% diversion target',color:CSSV('--ink3')}]}));
  wp.$body.appendChild(el('p',{cls:'note',html:'Two panels, not two axes: grams per unit and percentage of waste are different quantities. Waste per unit fell 292 → 262 g and cleared its −10% target; diversion has been flat at 98% since FY23.'}));
  two2.appendChild(wp);

  const cp=panel({kicker:'More circularity', title:'Post-industrial and post-consumer footwear recycling',
    grade:'descriptive', prov:'circularity_funnel',
    lede:'Factory scrap and consumer-returned material on the same chart, each as its own scale problem: the post-consumer stream is two orders of magnitude smaller and it fell 24% in FY25.',
    legend:legend([{color:'var(--ink)',label:'Post-industrial (factory scrap)'},
      {color:'var(--accent)',label:'Post-consumer + unsold goods'}])});
  cp.$body.appendChild(chBar({cats:Y6,v:D.footwear_sources.post_industrial,w:600,h:170,
    color:CSSV('--ink'),ylabel:'post-industrial, t',tfmt:v=>num(v)+' t',lfmt:v=>compact(v)}));
  cp.$body.appendChild(chBar({cats:Y6,v:D.footwear_sources.post_consumer_and_unsold,w:600,h:150,
    color:CSSV('--accent'),ylabel:'post-consumer, t',tfmt:v=>num(v)+' t',lfmt:v=>num(v)}));
  cp.$body.appendChild(el('p',{cls:'note',html:'Two panels, not two axes. The post-consumer stream is <b>2.2%</b> of footwear material recycled in FY25.'}));
  two2.appendChild(cp);
  wrap.appendChild(two2);

  /* funnel */
  const fp=panel({kicker:'The funnel', title:'Where circularity stops being measurable',
    grade:'descriptive', prov:'circularity_funnel', ann:ANN.circularity_funnel,
    lede:'Built from the five tabulated waste streams. Each stage is a stricter test than the one above it. The last stage is the one that matters for circularity and the reports do not disclose it.',
    table:()=>tbl(['Year','Generated','Diverted','Recycled + composted','Waste to energy','Landfilled','Diversion rate','Recycling rate','WtE share of diverted'],
      D.funnel.map(f=>[f.year,num(f.generated),num(f.diverted),num(f.recycled_or_composted),
        num(f.waste_to_energy),num(f.landfilled),f.diversion_rate.toFixed(1)+'%',
        f.recycling_rate.toFixed(1)+'%',f.wte_share_of_diverted.toFixed(1)+'%']))});
  const f=D.funnel[D.funnel.length-1];
  fp.$body.appendChild(chFunnel({w:660,stages:[
    {label:'Waste generated',v:f.generated},
    {label:'Diverted from landfill and incineration',v:f.diverted,lossLabel:'to landfill'},
    {label:'Recycled or composted',v:f.recycled_or_composted,lossLabel:'to waste-to-energy'},
    {label:'Traced to a named destination (footwear only)',v:D.footwear_sources.post_industrial['FY25']+D.footwear_sources.post_consumer_and_unsold['FY25'],lossLabel:'not traced'},
    {label:'Reintroduced into NIKE product',v:null}
  ]}));
  fp.$body.appendChild(el('p',{cls:'note',html:
    `<b>Diversion ${f.diversion_rate.toFixed(1)}% · material recovery ${f.recycling_rate.toFixed(1)}%.</b> `+
    `The ${f.wte_share_of_diverted.toFixed(1)}% of diverted tonnage that goes to waste-to-energy recovers energy, not material. `+
    `The p.30 disposition column reads "Recycled into NIKE Products and Other Industry Products" as a single category, so closed-loop cannot be separated from open-loop.`}));
  wrap.appendChild(fp);

  /* FPW */
  const fw=panel({kicker:'Finished product waste', title:'Units collected and recycled or donated',
    grade:'descriptive', prov:'circularity_funnel',
    lede:'A 10x target against a 1.3M-unit FY20 baseline. FY23 reached 17.9M units, then the series fell by two thirds and has not returned.'});
  fw.$body.appendChild(chBar({cats:Y6,v:D.fpw,w:660,h:220,
    color:(v)=>v>=13e6?CSSV('--ink'):CSSV('--accent'),
    ylabel:'units',tfmt:v=>num(v)+' units',lfmt:v=>compact(v,1),
    tnote:(v)=>`${(v/1.3e6).toFixed(1)}x the FY20 baseline · target 10x`}));
  fw.$body.appendChild(el('p',{cls:'note',html:'Bars at or above the 13M target are drawn in black. The target is <b>10x</b> the FY20 baseline, i.e. 13M units. FY25 reached 8.1M, or 6.3x. NIKE&rsquo;s footnote attributes the FY25 fall in post-consumer footwear recycling to an overall decrease in unsold goods, which is a demand signal rather than a programme signal.'}));
  wrap.appendChild(fw);
  return wrap;
}

/* ======================================================================
   VIEW 4 — WATER + CHEMISTRY
   ====================================================================== */
function view4(){
  const W=D.water;
  const wrap=el('div',{cls:'stack'});
  wrap.appendChild(el('div',{cls:'viewhead'},[
    el('div',{cls:'eyebrow',text:'View 04 · Efficiency or stewardship?'}),
    el('h2',{text:'Water + Chemistry'}),
    el('p',{text:'Intensity improved faster than withdrawal, which means the activity base grew. '+
      'Restoration is the only NIKE water target with a hard volume attached, and it is 96.7% in one country.'})
  ]));

  const two=el('div',{cls:'cols2'});
  const ip=panel({kicker:'Efficiency vs absolute', title:'Intensity, withdrawal and implied activity',
    grade:'diagnostic', prov:'water_dual', ann:ANN.water_dual,
    lede:'All three indexed to FY20 = 100. Implied activity is withdrawal ÷ intensity, an indicative quantity derived here, not a NIKE disclosure.',
    legend:legend([{color:'var(--accent)',label:'Freshwater intensity (L/kg)',line:true},
      {color:'var(--ref)',label:'Absolute freshwater use',line:true},
      {color:'var(--ink3)',label:'Implied dyed + finished mass',line:true}]),
    table:()=>tbl(['Year','Intensity L/kg','Absolute ML','Implied mass kg'],
      Y6.map(y=>[y,W.intensity[y],num(W.absolute_use[y]),num(W.implied_activity_kg[y])]))});
  ip.$body.appendChild(chLine({cats:Y6,w:600,h:280,zero:false,rpad:92,
    series:[
      {name:'Intensity',short:'Intensity',v:indexTo100(W.intensity,'FY20'),color:CSSV('--accent'),wt:2.4},
      {name:'Absolute use',short:'Absolute',v:indexTo100(W.absolute_use,'FY20'),color:CSSV('--ref'),wt:2.4},
      {name:'Implied activity',short:'Implied kg',v:indexTo100(W.implied_activity_kg,'FY20'),color:CSSV('--ink3'),wt:1.8,dash:'3 4'}],
    yfmt:v=>v.toFixed(0),tfmt:v=>v.toFixed(1)+' (FY20=100)',ylabel:'index, FY20 = 100',
    markers:[{v:100,label:'FY20',color:CSSV('--ink3')}]}));
  ip.$body.appendChild(el('div',{cls:'calc',style:'margin-top:12px',
    html:'FY20 20,609 ML ÷ 84 L/kg = 245.3M kg &nbsp;·&nbsp; FY25 17,853 ML ÷ 68 L/kg = 262.5M kg &nbsp;·&nbsp; <b>+7.0%</b>'}));
  two.appendChild(ip);

  const sp=panel({kicker:'Sources', title:'Where the water comes from',
    grade:'descriptive', prov:'water_dual',
    lede:'Municipal supply is 65% of withdrawal and has fallen 12%. Rainwater harvesting more than doubled in FY25 but remains 0.4% of the total.',
    legend:legend(Object.keys(W.sources).map((k,i)=>({color:`var(--seq${6-i})`,label:k}))),
    table:()=>tbl(['Source',...Y6,'Share FY25'],
      Object.entries(W.sources).map(([k,v])=>[k,...Y6.map(y=>num(v[y])),W.source_mix[k]['FY25']+'%']))});
  sp.$body.appendChild(chStack({cats:Y6,keys:Object.keys(W.sources),v:W.sources,
    colors:[6,5,4,3,2].map(i=>CSSV('--seq'+i)),w:600,h:280,ylabel:'million litres',tfmt:v=>num(v)+' ML'}));
  two.appendChild(sp);
  wrap.appendChild(two);

  const two2=el('div',{cls:'cols2'});
  const rp=panel({kicker:'Restoration', title:'Cumulative volume restored, and the annual increment',
    grade:'descriptive', prov:'water_dual',
    lede:'Cumulative restoration reads as steady growth. Differencing it gives the annual increment, which is the number a programme manager can act on.'});
  rp.$body.appendChild(chLine({cats:Y6,w:600,h:200,rpad:60,
    series:[{name:'Cumulative',short:'Cumulative',v:W.restoration_cumulative,color:CSSV('--ink'),wt:2.4}],
    yfmt:v=>compact(v,0),tfmt:v=>compact(v,2)+' L',ylabel:'litres, cumulative',
    markers:[{v:W.restoration_target,label:'13B target',color:CSSV('--accent')}]}));
  rp.$body.appendChild(chBar({cats:Y6.slice(1),v:W.restoration_annual,w:600,h:170,
    color:CSSV('--accent'),ylabel:'annual increment, litres',
    tfmt:v=>compact(v,2)+' L added',lfmt:v=>compact(v,1)}));
  rp.$body.appendChild(el('p',{cls:'note',html:
    `Remaining gap to the 13B target: <b>${compact(W.restoration_gap,1)} litres</b>. `+
    `The FY25 increment was ${compact(W.restoration_annual['FY25'],1)}, the largest in the series.`}));
  two2.appendChild(rp);

  const gp=panel({kicker:'Geography', title:'Restoration is one basin',
    grade:'descriptive', prov:'water_dual',
    lede:'Cumulative volume by country. Australia is 96.7% of the total; Pakistan is the only geography adding materially.',
    table:()=>tbl(['Geography',...Y6],
      Object.entries(W.restoration_geography).map(([k,v])=>[k,...Y6.map(y=>v[y]===null?'—':compact(v[y],2)+' L')]))});
  const geo=Object.entries(W.restoration_geography).map(([k,v])=>({label:k,v:v['FY25']||0,
    color:k==='Australia'?CSSV('--ink'):CSSV('--accent'),
    note:((v['FY25']||0)/W.restoration_cumulative['FY25']*100).toFixed(2)+'% of cumulative'}))
    .sort((a,b)=>b.v-a.v);
  gp.$body.appendChild(chHBar({rows:geo,w:560,lw:110,rh:30,tfmt:v=>compact(v,2)+' litres',lfmt:v=>compact(v,2)}));
  gp.$body.appendChild(el('p',{cls:'note',html:'Concentration here is a portfolio question. NIKE&rsquo;s cotton supply chain draws on basins in several countries; restored volume in one of them does not relieve stress in the others. The assured disclosure alongside this is the <b>funding</b> figure, USD 2,025,000 cumulative, not the litres.'}));
  two2.appendChild(gp);
  wrap.appendChild(two2);

  /* target gaps + chemistry */
  const two3=el('div',{cls:'cols2'});
  const tg=panel({kicker:'Target gap', title:'Water and chemistry targets against their required levels',
    grade:'descriptive', prov:'kpi_matrix',
    lede:'Bullet bars show completion of the required change; the rule is the target.'});
  const rows=D.targets.filter(t=>['Water','Chemistry'].includes(t.topic)).map(t=>({
    label:t.name, value:Math.max(0,t.completion), target:1, met:t.status==='Target Achieved',
    vlabel:(t.completion*100).toFixed(0)+'%', tlabel:'100%'}));
  tg.$body.appendChild(chBullet({rows,w:600,lw:230,rh:36}));
  two3.appendChild(tg);

  const cp=panel({kicker:'Chemistry', title:'Priority chemistries with a clean alternative',
    grade:'descriptive', prov:'kpi_matrix',
    lede:'A count, not a rate. Seven of ten by FY25 against a target of ten, with nothing recorded before FY23.'});
  cp.$body.appendChild(chBar({cats:Y6,v:D.chem,w:560,h:220,
    color:v=>v>=10?CSSV('--ink'):CSSV('--accent'),ylabel:'count of 10',
    tfmt:v=>v+' of 10 priority chemistries',lfmt:v=>String(v)}));
  cp.$body.appendChild(el('p',{cls:'note',html:'Three chemistries were added in FY23, four in FY24, one in FY25. A deceleration in a count this small is worth a question rather than a conclusion: the remaining three may be the hardest, or the programme may have slowed.'}));
  two3.appendChild(cp);
  wrap.appendChild(two3);
  return wrap;
}
window.__V3=view3; window.__V4=view4;
})();
</script>
<script>
(function(){
"use strict";
const K=window.__CH, U=window.__UI;
const {chLine,chBar,chHBar,chStack,chWaterfall,chHeat,chBullet,chBubble,chSankey,chSlope,chFunnel,
  el,s_,hov,CSSV,num,compact,sign,pctf,D,RQ,ANN,INS,Y6} = K;
const {panel,legend,tbl,onState,SEQ,indexTo100,pick} = U;
const basis=()=>U.getBasis();

/* ======================================================================
   VIEW 5 — SUPPLY CHAIN PEOPLE + COMPLIANCE
   ====================================================================== */
function view5(){
  const wrap=el('div',{cls:'stack'});
  wrap.appendChild(el('div',{cls:'viewhead'},[
    el('div',{cls:'eyebrow',text:'View 05 · From company averages to operational hotspots'}),
    el('h2',{text:'Supply Chain People + Compliance'}),
    el('p',{text:'1.29 million workers sit behind these numbers. Every percentage on this page is a composition '+
      'of audit findings within a tier, not a prevalence rate, and a finding is not evidence of unlawful conduct.'})
  ]));

  /* capability targets */
  const cp=panel({kicker:'Capability build', title:'Three supplier capability programmes, FY20 to FY25',
    grade:'descriptive', prov:'rsc_capability',
    lede:'Health and safety, gender equity and worker engagement all started from nothing and all but one finished at or near 100%. Gender equity landed at 99%.',
    legend:legend([{color:'var(--ink)',label:'Health & safety maturity',line:true},
      {color:'var(--accent)',label:'Gender-equitable capability',line:true},
      {color:'var(--ref)',label:'Measuring + improving engagement',line:true}])});
  const drawCap=()=>{
    cp.$body.innerHTML='';
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const t=id=>{const x=D.targets.find(q=>q.id===id); return pick(basis()==='latest'?x.latest:(x.original||x.latest),ys);};
    cp.$body.appendChild(chLine({cats:ys,w:640,h:270,rpad:60,
      series:[
        {name:'Health & safety',short:'H&S',v:t('rsc_hs_level3_pct'),color:CSSV('--ink'),wt:2.4},
        {name:'Gender equity',short:'GE',v:t('rsc_gender_equity_pct'),color:CSSV('--accent'),wt:2.4},
        {name:'Worker engagement',short:'WE',v:t('rsc_worker_engagement_pct'),color:CSSV('--ref'),wt:2.4}],
      yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v+'% of strategic suppliers',ylabel:'% of strategic suppliers',
      markers:[{v:100,label:'100% target',color:CSSV('--ink3')}]}));
  };
  drawCap(); onState(drawCap); wrap.appendChild(cp);

  /* FE slope + factory ratings */
  const two=el('div',{cls:'cols2'});
  const fp=panel({kicker:'Foundational Expectations', title:'Compliance by value-chain area',
    grade:'descriptive', prov:'fe_slope',
    lede:'Air MI and Tier 1 are at or near 100%. Distribution centres moved backwards in FY25, from 60% to 50%, the only area to do so.',
    table:()=>tbl(['Area',...Y6],Object.entries(D.fe_by_area).map(([k,v])=>[k,...Y6.map(y=>v[y]===null?'not measured':v[y]+'%')]))});
  const drawFE=()=>{
    fp.$body.innerHTML='';
    const src=basis()==='latest'?D.fe_by_area:D.fe_by_area_orig;
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const cols={'All NIKE':CSSV('--ink'),'Tier 1':CSSV('--ref'),'Tier 2':CSSV('--third'),
      'DC':CSSV('--accent'),'Air MI':CSSV('--ink3')};
    fp.$body.appendChild(chLine({cats:ys,w:600,h:280,rpad:74,
      series:Object.entries(src).map(([k,v])=>({name:k,short:k,v:pick(v,ys),color:cols[k],wt:k==='DC'?2.6:2})),
      yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v+'% compliant',ylabel:'% compliance'}));
    fp.$body.appendChild(el('p',{cls:'note',html:'The cohort expands over the period: Tier 2, DCs and Air MI were not measured in FY20. The All NIKE line therefore mixes a compliance change with a denominator change between FY20 and FY22, which is why the two cohorts are shown separately below.'}));
    const co=D.fe_cohort, cy=Object.keys(co[Object.keys(co)[0]]);
    fp.$body.appendChild(chLine({cats:cy,w:600,h:190,rpad:64,
      series:[{name:'FY20 target scope',short:'Original scope',v:co['FY20 target scope (T1 & high visibility T2)'],color:CSSV('--ink'),wt:2.2},
        {name:'FY25 scope expansion',short:'Expansion',v:co['FY25 target scope expansion (additional T2, DCs & Air MI)'],color:CSSV('--accent'),wt:2.2}],
      yfmt:v=>v.toFixed(0)+'%',tfmt:v=>v+'% compliant',ylabel:'% by cohort'}));
  };
  drawFE(); onState(drawFE); two.appendChild(fp);

  const rp=panel({kicker:'Factory ratings', title:'SMSI rating distribution, Tier 1 and Tier 2',
    grade:'descriptive', prov:'factory_ratings',
    lede:'Enrolled facilities grew from 463 to 666. Bronze, the baseline-compliance rating, absorbed almost all of the growth; no facility has ever been rated Gold.',
    legend:legend([{color:'var(--ink)',label:'Silver'},{color:'var(--seq4)',label:'Bronze'},
      {color:'var(--accent)',label:'Red'},{color:'var(--seq2)',label:'No rating'},{color:'var(--seq6)',label:'Zero tolerance'}]),
    table:()=>tbl(['Rating',...Y6],Object.entries(D.factory_ratings).map(([k,v])=>[k,...Y6.map(y=>num(v[y]))]))});
  const drawRat=()=>{
    rp.$body.innerHTML='';
    const ys=basis()==='latest'?Y6:Y6.slice(0,5);
    const keys=['Silver','Bronze','Red','No Rating','Zero Tolerance'];
    const v={}; keys.forEach(k=>v[k]=pick(D.factory_ratings[k],ys));
    rp.$body.appendChild(chStack({cats:ys,keys,v,
      colors:[CSSV('--ink'),SEQ(4),CSSV('--accent'),SEQ(2),SEQ(6)],w:600,h:280,
      ylabel:'facilities',tfmt:x=>num(x)+' facilities'}));
    rp.$body.appendChild(el('p',{cls:'note',html:'Red means serious issues or failure to return to compliance; Zero Tolerance means critical issues demanding immediate action. Both fell sharply after FY22, from 186 and 38 to 52 and 2.'}));
  };
  drawRat(); onState(drawRat); two.appendChild(rp);
  wrap.appendChild(two);

  /* heatmap */
  const hp=panel({kicker:'Findings', title:'Audit non-compliance composition, FY25',
    grade:'descriptive', prov:'compliance_heatmap', ann:ANN.compliance_heatmap,
    lede:'Each column sums to 100. A cell is the share of that tier&rsquo;s findings falling in that category, <b>not</b> the share of facilities with the issue and <b>not</b> a worker-level rate.',
    table:()=>tbl(['Category','T1 FY24','T1 FY25','Δ p.p.','T2 FY24','T2 FY25','Δ p.p.','DC FY24','DC FY25','Δ p.p.'],
      D.compliance_matrix.map(r=>[r.category,r['Tier 1_FY24'],r['Tier 1_FY25'],sign(r['Tier 1_change_pp']),
        r['Tier 2_FY24'],r['Tier 2_FY25'],sign(r['Tier 2_change_pp']),
        r['DCs_FY24'],r['DCs_FY25'],sign(r['DCs_change_pp'])]))});
  const drawHeat=()=>{
    hp.$body.innerHTML='';
    const suffix = basis()==='latest'?'_FY25':'_FY24';
    const rows=D.compliance_matrix.map(r=>({label:r.category,
      v:{'Tier 1':r['Tier 1'+suffix],'Tier 2':r['Tier 2'+suffix],'Distribution centres':r['DCs'+suffix]}}))
      .sort((a,b)=>(b.v['Tier 1']+b.v['Tier 2']+b.v['Distribution centres'])-(a.v['Tier 1']+a.v['Tier 2']+a.v['Distribution centres']));
    hp.$body.appendChild(chHeat({rows,cols:['Tier 1','Tier 2','Distribution centres'],cw:118,lw:250,
      tnote:(r,c)=>`<br>share of ${c} findings, ${basis()==='latest'?'FY25':'FY24'}`}));
  };
  drawHeat(); onState(drawHeat); wrap.appendChild(hp);

  /* movers */
  const two2=el('div',{cls:'cols2'});
  const mp=panel({kicker:'Change', title:'What moved in the Tier 1 composition, FY24 to FY25',
    grade:'descriptive', prov:'compliance_heatmap',
    lede:'Percentage-point change in each category&rsquo;s share of Tier 1 findings. A category can rise because another fell.'});
  const mrows=D.compliance_matrix.map(r=>({label:r.category,v:r['Tier 1_change_pp'],
    color:r['Tier 1_change_pp']>0?CSSV('--accent'):CSSV('--ref'),
    note:`${r['Tier 1_FY24']}% → ${r['Tier 1_FY25']}%`}))
    .filter(r=>Math.abs(r.v)>=0.4).sort((a,b)=>b.v-a.v);
  mp.$body.appendChild(chHBar({rows:mrows,w:600,lw:250,rh:22,
    afmt:v=>v.toFixed(0),lfmt:v=>sign(v),tfmt:v=>sign(v)+' p.p. of the Tier 1 composition'}));
  two2.appendChild(mp);

  const wp=panel({kicker:'Workforce', title:'Where the workers are',
    grade:'descriptive', prov:'workers',
    lede:'South East and South Asia hold 78% of the extended supply chain workforce. Distribution centres hold 1.9%.',
    legend:legend([{color:'var(--seq6)',label:'Tier 1'},{color:'var(--seq4)',label:'Tier 2'},{color:'var(--accent)',label:'Distribution centres'}]),
    table:()=>tbl(['Region','Tier 1','Tier 2','DCs','Total','Share'],
      Object.entries(D.workers).map(([k,v])=>[k,num(v[0]),num(v[1]),num(v[2]),num(v[3]),v[4]+'%']))});
  const drawW=()=>{
    wp.$body.innerHTML='';
    const src=basis()==='latest'?D.workers:D.workers_orig;
    const regions=Object.keys(src).filter(k=>k!=='Total');
    const v={'Tier 1':{},'Tier 2':{},'Distribution centres':{}};
    regions.forEach(r=>{v['Tier 1'][r]=src[r][0];v['Tier 2'][r]=src[r][1];v['Distribution centres'][r]=src[r][2];});
    wp.$body.appendChild(chStack({cats:regions,keys:['Tier 1','Tier 2','Distribution centres'],v,
      colors:[SEQ(6),SEQ(4),CSSV('--accent')],w:600,h:270,ylabel:'workers',tfmt:x=>num(x)+' workers'}));
  };
  drawW(); onState(drawW); two2.appendChild(wp);
  wrap.appendChild(two2);

  /* exposure proxy */
  const ep=panel({kicker:'Prioritisation', title:'Audit finding exposure proxy',
    grade:'diagnostic', prov:'exposure_proxy', ann:ANN.exposure_proxy,
    lede:'Finding-category share within a tier, multiplied by the workers associated with that tier, summed across tiers.',
    table:()=>tbl(['Category','T1 share','T1 proxy','T2 share','T2 proxy','DC share','DC proxy','Total proxy'],
      D.exposure.map(r=>[r.category,r['Tier 1_finding_share_pct']+'%',num(r['Tier 1_proxy']),
        r['Tier 2_finding_share_pct']+'%',num(r['Tier 2_proxy']),
        r['DCs_finding_share_pct']+'%',num(r['DCs_proxy']),num(r.total_proxy)]))});
  ep.$body.appendChild(el('div',{style:'border:1px solid var(--accent);background:var(--accent-wash);border-radius:8px;padding:12px 14px;margin-bottom:14px'},[
    el('div',{style:'font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:6px',text:'Read this before the chart'}),
    el('p',{cls:'note',style:'margin:0;color:var(--ink2)',html:
      'This is <b>not</b> a count of workers affected. It is <b>not</b> incidence or prevalence. It does <b>not</b> imply that any worker at an audited facility experienced the issue. '+
      'The finding shares are a composition across categories within a tier, so the components are not independent probabilities and the proxy cannot be summed into a population total. '+
      'It is a prioritisation device: it ranks categories by the scale of workforce sitting behind the tier where the finding concentrates.'})
  ]));
  ep.$body.appendChild(chHBar({rows:D.exposure.slice(0,12).map(r=>({label:r.category,v:r.total_proxy,
    color:CSSV('--ref'),note:`T1 ${r['Tier 1_finding_share_pct']}% · T2 ${r['Tier 2_finding_share_pct']}% · DC ${r['DCs_finding_share_pct']}%`})),
    w:640,lw:252,rh:24,tfmt:v=>num(v)+' (index)',lfmt:v=>compact(v)}));
  ep.$body.appendChild(el('p',{cls:'note',html:
    'Working hours is 46.2% of distribution-centre findings, the single largest cell in the matrix, but distribution centres hold 1.9% of the workforce, so that cell contributes 11,230 of the category&rsquo;s 176,854 proxy points. '+
    'The Tier 1 share of 12.7% contributes 140,514. <b>Scale changes which column deserves attention first.</b>'}));
  wrap.appendChild(ep);

  /* OH&S */
  const op=panel({kicker:'Health and safety outcomes', title:'Injury rates against industry benchmarks',
    grade:'descriptive', prov:'rsc_capability',
    lede:'Total case incident rate. Supplier focus-factory rates are self-reported and, in the FY24 report, the CY22 column reproduced the adjacent NIKE column; the FY25 values shown here are the corrected ones.',
    legend:legend([{color:'var(--accent)',label:'NIKE distribution',line:true},{color:'var(--ink)',label:'NIKE Air MI',line:true},
      {color:'var(--ref)',label:'T1 focus factories, footwear',line:true},{color:'var(--third)',label:'T1 focus factories, apparel',line:true}])});
  const ohsY=['CY20','CY21','CY22','FY23','FY24','FY25'];
  op.$body.appendChild(chLine({cats:ohsY,w:660,h:250,rpad:118,
    series:[
      {name:'NIKE distribution',short:'NIKE DC',v:D.ohs['NIKE Distribution | TCIR | NIKE'],color:CSSV('--accent'),wt:2.2},
      {name:'NIKE Air MI',short:'NIKE Air MI',v:D.ohs['NIKE Air MI | TCIR | NIKE'],color:CSSV('--ink'),wt:2.2},
      {name:'T1 footwear',short:'T1 footwear',v:D.ohs['Tier 1 Focus Factories Footwear | TCIR | Supplier'],color:CSSV('--ref'),wt:2.2},
      {name:'T1 apparel',short:'T1 apparel',v:D.ohs['Tier 1 Focus Factories Apparel | TCIR | Supplier'],color:CSSV('--third'),wt:2.2}],
    yfmt:v=>v.toFixed(1),tfmt:v=>v.toFixed(2)+' per 100 FTE-years',ylabel:'total case incident rate'}));
  op.$body.appendChild(el('p',{cls:'note',html:
    'CY20 to CY22 are calendar years and FY23 to FY25 are fiscal years within the same row, so the series is not differenced across that boundary anywhere in this project. '+
    'Supplier rates are one to two orders of magnitude below NIKE&rsquo;s own operations and below their industry benchmarks; NIKE discloses that the data is self-reported and may be incomplete, with some values estimated.'}));
  wrap.appendChild(op);
  return wrap;
}
window.__V5=view5;
})();
</script>
<script>
(function(){
"use strict";
const K=window.__CH, U=window.__UI;
const {chLine,chBar,chHBar,chStack,chWaterfall,chHeat,chBullet,chBubble,chSlope,chFunnel,
  el,s_,hov,CSSV,num,compact,sign,pctf,D,RQ,ANN,INS,Y6,Y11} = K;
const {panel,legend,tbl,onState,SEQ,alertCard} = U;
const basis=()=>U.getBasis();

/* ======================================================================
   VIEW 6 — DATA TRUST + METHODOLOGY
   ====================================================================== */
function view6(){
  const wrap=el('div',{cls:'stack'});
  wrap.appendChild(el('div',{cls:'viewhead'},[
    el('div',{cls:'eyebrow',text:'View 06 · Audit every conclusion above'}),
    el('h2',{text:'Data Trust + Methodology'}),
    el('p',{text:'Every figure in the other five views resolves to a report, a page, a table and a footnote. '+
      'Every value that changed between the two report vintages is listed here with a classification and, where NIKE '+
      'gave one, the stated reason.'})
  ]));

  /* coverage */
  const cov=D.coverage;
  wrap.appendChild(panel({kicker:'Coverage', title:'What the pipeline holds',
    grade:'descriptive', prov:'validation_panel', flat:true,
    after:el('div',{cls:'cols3'},[
      alertCard(num(cov.rows),'tidy observations',`${cov.metrics} distinct metrics across ${cov.tables} source tables.`),
      alertCard(num(cov.fy25_rows),'from the FY25 report','Latest restated basis, the project default.'),
      alertCard(num(cov.fy24_rows),'from the FY24 report','Kept in full so the original vintage is never lost.'),
      alertCard(num(D.reconciliation.length),'overlapping observations','Values printed in both reports and compared one by one.'),
      alertCard(String(D.methodology_changes.length),'registered methodology changes','Each dated, sourced and tied to the series it moves.'),
      alertCard(D.validation.filter(v=>v.match_status==='match').length+'/'+D.validation.length,'validation checks passing','Read off the PDF by hand and compared with the processed dataset.')
    ])}));

  /* reconciliation */
  const rc=panel({kicker:'Version control', title:'FY24-reported against FY25-reported, value by value',
    grade:'descriptive', prov:'lineage', ann:ANN.lineage,
    lede:'Every historical observation printed in both reports. <b>Identical</b> means the two vintages agree exactly. '+
      '<b>Rounding</b> means the more precise value falls inside the interval the less precise printing implies. '+
      '<b>Restatement</b> means NIKE revised the value, whether or not it said so. '+
      '<b>Derived restatement</b> means a printed figure moved without acknowledgement but the arithmetic of the surrounding table shows it. '+
      '<b>Undetermined</b> means the values differ, the difference is outside the rounding interval, and no reason is given.',
    table:()=>tbl(['Table','Series','Period','As of FY24','As of FY25','Difference','Class'],
      D.reconciliation.filter(r=>r.difference_class!=='identical')
        .map(r=>[r.source_table,r.series,r.period,
          r.reported_as_of_FY24===null?'—':num(r.reported_as_of_FY24,Math.abs(r.reported_as_of_FY24)<10?2:0),

  wrap.appendChild(el('p',{cls:'note',style:'text-align:center;padding:4px 0 0',
    html:'Independent portfolio analysis by Vishal Kennedy. Not affiliated with, endorsed by, or produced for NIKE, Inc. '+
      'Source: FY24 and FY25 NIKE, Inc. Sustainability Data, <a href="https://about.nike.com/mission" rel="noopener">about.nike.com/mission</a>.'}));
  return wrap;
}
window.__V0=view0;
})();
</script>
<script>
(function(){
"use strict";
const K=window.__CH, U=window.__UI;
const {el,CSSV,Y11,$} = K;
const VIEWS=[
  {id:'brief', n:'00', t:'The Question', f:()=>window.__V0()},
  {id:'tower', n:'01', t:'Sustainability Control Tower', f:()=>window.__V1()},
  {id:'carbon', n:'02', t:'Carbon Systems Map', f:()=>window.__V2()},
  {id:'materials', n:'03', t:'Materials + Circularity Lab', f:()=>window.__V3()},
  {id:'water', n:'04', t:'Water + Chemistry', f:()=>window.__V4()},
  {id:'people', n:'05', t:'Supply Chain People + Compliance', f:()=>window.__V5()},
  {id:'trust', n:'06', t:'Data Trust + Methodology', f:()=>window.__V6()},
  {id:'insights', n:'—', t:'Eight Findings', f:()=>window.__V7()}
];
const nav=$('#nav'), main=$('#main'), where=$('#where');
let current='brief';

VIEWS.forEach(v=>{
  nav.appendChild(el('button',{cls:'navbtn','aria-current':v.id===current?'true':'false',
    'data-id':v.id, onclick:()=>go(v.id)},[
    el('span',{cls:'n',text:v.n}), el('span',{cls:'t',text:v.t})]));
});

function go(id){
  current=id;
  const v=VIEWS.find(x=>x.id===id);
  nav.querySelectorAll('.navbtn').forEach(b=>b.setAttribute('aria-current', b.dataset.id===id?'true':'false'));
  where.textContent=v.t;
  U.reset();
  main.innerHTML='';
  main.appendChild(v.f());
  main.scrollIntoView({block:'start',behavior:'auto'});
  window.scrollTo({top:0});
  try{ localStorage.setItem('nike_view', id); }catch(e){}
}

/* basis toggle */
document.querySelectorAll('[data-basis]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('[data-basis]').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
    U.setBasis(b.dataset.basis);
    go(current);
    try{ localStorage.setItem('nike_basis', b.dataset.basis); }catch(e){}
  });
});


/* theme */
const tb=$('#themebtn');
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  tb.textContent = dark?'Light':'Dark';
  tb.setAttribute('aria-pressed', dark?'true':'false');
}
let theme=null;
try{ theme=localStorage.getItem('nike_theme')||null; }catch(e){}
applyTheme(theme);
tb.addEventListener('click',()=>{
  const dark = tb.getAttribute('aria-pressed')==='true';
  theme = dark?'light':'dark';
  applyTheme(theme);
  try{ localStorage.setItem('nike_theme', theme); }catch(e){}
  go(current);
});

/* restore */
try{
  const sb=localStorage.getItem('nike_basis');
  if(sb==='original'){ U.setBasis('original');
    document.querySelectorAll('[data-basis]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.basis==='original'?'true':'false')); }
  const sv=localStorage.getItem('nike_view');
  if(sv && VIEWS.some(v=>v.id===sv)) current=sv;
}catch(e){}

go(current);
})();
</script>
